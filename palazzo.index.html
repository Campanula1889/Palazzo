}

function fUSD(n) {
  if (Math.abs(n) >= 1e6) return `$${(n/1e6).toFixed(2)}M`;
  if (Math.abs(n) >= 1e3) return `$${(n/1e3).toFixed(1)}K`;
  return `$${n.toFixed(2)}`;
}

function DonutChart({ data, total, usdKrw }) {
  if (total === 0) return null;
  let cum = 0;
  const slices = data.map(d => { const pct=d.value/total; const s=cum; cum+=pct; return {...d,pct,start:s}; });
  const r=70,cx=90,cy=90,sw=22;
  const arc=(s,e)=>{
    const a1=s*2*Math.PI-Math.PI/2, a2=e*2*Math.PI-Math.PI/2;
    const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    return `M ${x1} ${y1} A ${r} ${r} 0 ${(e-s)>0.5?1:0} 1 ${x2} ${y2}`;
  };
  return (
    <div style={{display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
      <svg width={180} height={180}>
        {slices.map((s,i)=>(
          <path key={i} d={arc(s.start,s.start+s.pct)} fill="none"
            stroke={COLORS[s.label]||"#888"} strokeWidth={sw} strokeLinecap="butt"/>
        ))}
        <text x={cx} y={cy-8} textAnchor="middle" fill="#94a3b8" fontSize={10} fontWeight={600}>총자산</text>
        <text x={cx} y={cy+7} textAnchor="middle" fill="#f1f5f9" fontSize={12} fontWeight={700}>{fUSD(total)}</text>
        <text x={cx} y={cy+22} textAnchor="middle" fill="#64748b" fontSize={9}>₩{Math.round(total*usdKrw/1e8).toFixed(1)}억</text>
      </svg>
      <div style={{display:"flex",flexDirection:"column",gap:5}}>
        {slices.map((s,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:8,fontSize:12}}>
            <div style={{width:10,height:10,borderRadius:2,background:COLORS[s.label]||"#888",flexShrink:0}}/>
            <span style={{color:"#cbd5e1",minWidth:72}}>{s.label}</span>
            <span style={{color:"#f1f5f9",fontWeight:600}}>{(s.pct*100).toFixed(1)}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function AllocationBar({ current, target, label }) {
  const diff = current - target;
  const maxW = Math.max(current, target, 1);
  return (
    <div style={{marginBottom:8}}>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#94a3b8",marginBottom:3}}>
        <span style={{fontSize:10}}>{label}</span>
        <span style={{color:Math.abs(diff)>3?"#f59e0b":"#94a3b8"}}>
          현재 {current.toFixed(1)}% / 목표 {target.toFixed(1)}%
          {Math.abs(diff)>0.1&&<span style={{marginLeft:4,color:diff>0?"#ef4444":"#22c55e"}}>({diff>0?"+":""}{diff.toFixed(1)}%)</span>}
        </span>
      </div>
      <div style={{position:"relative",height:6,background:"#1e293b",borderRadius:3}}>
        <div style={{position:"absolute",height:"100%",width:`${(current/maxW)*100}%`,background:"#3b82f6",borderRadius:3,opacity:0.8}}/>
        <div style={{position:"absolute",top:-2,height:10,width:2,background:"#f59e0b",borderRadius:1,left:`${(target/maxW)*100}%`}}/>
      </div>
    </div>
  );
}

  const [sortDir, setSortDir] = useState("desc");

  useEffect(()=>{ try{localStorage.setItem(STORAGE_KEY,JSON.stringify(holdings));}catch{} },[holdings]);

  const getPrice = (h) => h.manualPrice || prices[h.ticker] || null;

  const autoTickers = holdings.filter(h=>h.type!=="한국주식"&&!h.manualPrice).map(h=>h.ticker);

  const fetchExchangeRate = useCallback(async()=>{
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:200,
          tools:[{type:"web_search_20250305",name:"web_search"}],
          messages:[{role:"user",content:'Return ONLY JSON: {"USDKRW":1380.5} with current USD/KRW rate. No explanation.'}]
        })
      });
      const data = await res.json();
      for(const b of (data.content||[]).filter(b=>b.type==="text")){
        const m=b.text.match(/\{[\s\S]*\}/);
        if(m){const p=JSON.parse(m[0]); if(p.USDKRW>900&&p.USDKRW<2000) setUsdKrw(p.USDKRW);}
      }
    }catch{}
  },[]);

  const fetchPrices = useCallback(async()=>{
    if(autoTickers.length===0) return;
    setLoading(true);
    fetchExchangeRate();
    try{
      const np={...prices};
      const cs=15;
      for(let i=0;i<autoTickers.length;i+=cs){
        const chunk=autoTickers.slice(i,i+cs);
        const res=await fetch("https://api.anthropic.com/v1/messages",{
          method:"POST", headers:{"Content-Type":"application/json"},
          body:JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:1000,
            tools:[{type:"web_search_20250305",name:"web_search"}],
            messages:[{role:"user",content:`Return ONLY JSON object with current USD prices for: ${chunk.join(", ")}. Example: {"TSLA":180.5}. No markdown.`}]
          })
        });
        const data=await res.json();
        for(const b of (data.content||[]).filter(b=>b.type==="text")){
          const m=b.text.match(/\{[\s\S]*\}/);
          if(m){const p=JSON.parse(m[0]); Object.entries(p).forEach(([k,v])=>{if(typeof v==="number"&&v>0) np[k]=v;});}
        }
      }
      setPrices(np); setLastUpdated(new Date());
    }catch{}
    setLoading(false);
  },[autoTickers.join(",")]);

  useEffect(()=>{fetchPrices();},[]);

  const enriched = holdings.map(h=>{
    const rawPrice=getPrice(h);
    const isKRW=h.type==="한국주식";
    const priceKRW=isKRW?rawPrice:(rawPrice?rawPrice*usdKrw:null);
    const priceUSD=isKRW?(rawPrice?rawPrice/usdKrw:null):rawPrice;
    const avgCostKRW=isKRW?h.avgCost:h.avgCost*usdKrw;
    const avgCostUSD=isKRW?h.avgCost/usdKrw:h.avgCost;
    const value=priceUSD!=null?priceUSD*h.qty:null;
    const valueKRW=priceKRW!=null?priceKRW*h.qty:null;
    const cost=avgCostUSD*h.qty;
    const costKRW=avgCostKRW*h.qty;
    const pnl=value!=null?value-cost:null;
    const pnlPct=(pnl!=null&&cost>0)?(pnl/cost)*100:null;
    return {...h,rawPrice,priceUSD,priceKRW,value,valueKRW,cost,costKRW,pnl,pnlPct,isKRW,avgCostUSD,avgCostKRW};

        </div>
      </div>

      <div style={{padding:"14px 14px 100px"}}>

      {/* ── DASHBOARD ── */}
      {view==="dashboard" && (<>
        {/* Backup row */}
        <div style={{display:"flex",gap:8,marginBottom:12}}>
          <button onClick={exportData} style={{flex:1,padding:"8px",borderRadius:7,border:`1px solid ${C.border}`,background:"transparent",color:C.sub,fontSize:11,fontWeight:600,cursor:"pointer"}}>📥 JSON 백업</button>
          <label style={{flex:1,padding:"8px",borderRadius:7,border:`1px solid ${C.border}`,background:"transparent",color:C.sub,fontSize:11,fontWeight:600,cursor:"pointer",textAlign:"center"}}>
            📤 JSON 복원<input type="file" accept=".json" style={{display:"none"}} onChange={importData}/>
          </label>
        </div>

        {/* Summary card */}
        <div style={{background:"#162032",border:"1px solid #1e3a5f",borderRadius:14,padding:16,marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
            <div>
              <div style={{fontSize:10,color:C.muted,fontWeight:600,textTransform:"uppercase",marginBottom:4}}>총 자산</div>
              <div style={{fontSize:26,fontWeight:800,letterSpacing:-1}}>
                {totalValue>0?fUSD(totalValue):<span style={{color:C.border,fontSize:16}}>시세 로딩 중...</span>}
              </div>
              {totalValue>0&&<div style={{fontSize:12,color:C.sub,marginTop:2}}>≈ ₩{Math.round(totalValue*usdKrw/1e8).toFixed(2)}억</div>}
            </div>
            <div style={{textAlign:"right"}}>
              <button onClick={fetchPrices} disabled={loading}
                style={{padding:"7px 12px",borderRadius:7,border:`1px solid ${C.border}`,background:"transparent",color:loading?C.muted:C.accent,fontSize:12,fontWeight:600,cursor:"pointer"}}>
                {loading?"⟳ 조회중...":"↻ 새로고침"}
              </button>
              <div style={{fontSize:10,color:C.muted,marginTop:5}}>$1 = ₩{usdKrw.toLocaleString(undefined,{maximumFractionDigits:0})}</div>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
            {[
              ["매입금액", fUSD(totalCost), `₩${Math.round(totalCost*usdKrw/1e8).toFixed(2)}억`],
              ["총 손익", totalValue>0?`${totalPnl>=0?"+":""}${fUSD(totalPnl)}`:"—",
                totalValue>0?`${totalPnl>=0?"+":""}₩${Math.round(Math.abs(totalPnl)*usdKrw/1e8).toFixed(2)}억`:""],
              ["수익률", totalValue>0?`${totalPnlPct>=0?"+":""}${totalPnlPct.toFixed(1)}%`:"—", ""],
            ].map(([label,val,sub],i)=>(
              <div key={i} style={{background:C.bg,borderRadius:8,padding:"10px 10px"}}>
                <div style={{fontSize:9,color:C.muted,marginBottom:3}}>{label}</div>
                <div style={{fontSize:13,fontWeight:700,color:i===0?C.sub:i===2?(totalPnlPct>=0?C.green:C.red):(totalPnl>=0?C.green:C.red)}}>{val}</div>
                {sub&&<div style={{fontSize:9,color:i===0?C.muted:(totalPnl>=0?"#16a34a":"#dc2626"),marginTop:1}}>{sub}</div>}
              </div>
            ))}
          </div>
          {lastUpdated&&<div style={{fontSize:9,color:"#1e3a5f",marginTop:8,textAlign:"right"}}>업데이트: {lastUpdated.toLocaleTimeString("ko-KR")}</div>}
        </div>

        {/* Account breakdown */}
        <div style={{background:C.card,borderRadius:12,padding:14,marginBottom:12}}>
          <div style={{fontSize:11,color:C.muted,fontWeight:600,textTransform:"uppercase",marginBottom:10}}>계좌별</div>
          {byAccount.map(a=>(
            <div key={a.account} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:`1px solid ${C.bg}`}}>
              <span style={{fontWeight:600,fontSize:13}}>{a.account}</span>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:14,fontWeight:700}}>{fUSD(a.value)}</div>
                <div style={{fontSize:10,color:C.muted}}>₩{Math.round(a.value*usdKrw/1e8).toFixed(2)}억</div>
                <div style={{fontSize:11,color:a.pnl>=0?C.green:C.red}}>{a.pnl>=0?"+":""}{fUSD(a.pnl)}</div>
              </div>
            </div>
          ))}
        </div>

        {/* Donut */}
        <div style={{background:C.card,borderRadius:12,padding:14,marginBottom:12}}>
          <div style={{fontSize:11,color:C.muted,fontWeight:600,textTransform:"uppercase",marginBottom:10}}>자산 유형</div>
          <DonutChart data={byType} total={totalValue} usdKrw={usdKrw}/>
        </div>

        {/* Top movers */}
        <div style={{background:C.card,borderRadius:12,padding:14}}>
          <div style={{fontSize:11,color:C.muted,fontWeight:600,textTransform:"uppercase",marginBottom:10}}>상위 손익</div>
          {[...enriched].filter(h=>h.pnl!==null).sort((a,b)=>Math.abs(b.pnl)-Math.abs(a.pnl)).slice(0,6).map(h=>(
            <div key={h.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:`1px solid ${C.bg}`}}>
              <div><span style={{fontWeight:700,fontSize:13}}>{h.ticker}</span><span style={{fontSize:10,color:C.muted,marginLeft:6}}>{h.name}</span></div>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:12,fontWeight:700,color:h.pnl>=0?C.green:C.red}}>{h.pnl>=0?"+":""}{fUSD(h.pnl)}</div>
                <div style={{fontSize:10,color:h.pnlPct>=0?C.green:C.red}}>{h.pnlPct>=0?"+":""}{h.pnlPct?.toFixed(1)}%</div>
              </div>
            </div>
          ))}
        </div>
      </>)}

      {/* ── HOLDINGS ── */}
      {view==="holdings" && (<>
        <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
          {["전체",...ACCOUNTS].map(a=>(
            <button key={a} onClick={()=>setFilterAccount(a)}
              style={{padding:"4px 10px",borderRadius:5,border:`1px solid ${filterAccount===a?C.accent:C.border}`,
                background:filterAccount===a?C.accent+"22":"transparent",color:filterAccount===a?C.accent:C.sub,fontSize:11,fontWeight:600,cursor:"pointer"}}>
              {a}
            </button>
          ))}
        </div>
        <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
          {["전체",...ASSET_TYPES].map(t=>(
            <button key={t} onClick={()=>setFilterType(t)}
              style={{padding:"4px 10px",borderRadius:5,border:`1px solid ${filterType===t?C.accent:C.border}`,
                background:filterType===t?C.accent+"22":"transparent",color:filterType===t?C.accent:C.sub,fontSize:11,fontWeight:600,cursor:"pointer"}}>
              {t}
            </button>
          ))}
        </div>

        {sorted.map(h=>{
          const weight=totalValue>0?((h.value||0)/totalValue*100):0;
          const pnlBarW=h.pnlPct!=null?Math.min(Math.abs(h.pnlPct)/2,100):0;
          return (
          <div key={h.id} style={{background:C.card,borderRadius:12,padding:"14px 14px 10px",marginBottom:10,borderLeft:`3px solid ${COLORS[h.type]||C.border}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div>
                <span style={{fontWeight:800,fontSize:15}}>{h.ticker}</span>
                <span style={{fontSize:11,color:C.muted,marginLeft:6}}>{h.name}</span>
                <div style={{marginTop:4,display:"flex",gap:5,alignItems:"center"}}>
                  <span style={badge(h.type)}>{h.type}</span>
                  <span style={{fontSize:10,color:"#475569"}}>{h.account}</span>
                  {weight>0&&<span style={{fontSize:10,color:C.muted}}>{weight.toFixed(1)}%</span>}
                </div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:15,fontWeight:800}}>{h.value!=null?fUSD(h.value):<span style={{color:"#475569",fontSize:12}}>대기중</span>}</div>
                {h.value!=null&&<div style={{fontSize:10,color:C.muted,marginTop:1}}>₩{Math.round((h.value||0)*usdKrw).toLocaleString()}</div>}
                {h.pnl!=null&&<div style={{fontSize:12,fontWeight:700,color:h.pnl>=0?C.green:C.red,marginTop:2}}>{h.pnl>=0?"+":""}{fUSD(h.pnl)} ({h.pnlPct>=0?"+":""}{h.pnlPct?.toFixed(1)}%)</div>}
                {h.pnl!=null&&<div style={{fontSize:10,color:h.pnl>=0?"#16a34a":"#dc2626"}}>{h.pnl>=0?"+":""}₩{Math.round(h.pnl*usdKrw).toLocaleString()}</div>}
              </div>
            </div>

            {h.pnlPct!=null&&(
              <div style={{margin:"10px 0 6px",height:3,background:C.bg,borderRadius:2}}>
                <div style={{height:"100%",width:`${pnlBarW}%`,background:h.pnlPct>=0?C.green:C.red,borderRadius:2}}/>
              </div>
            )}

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:6,marginTop:8}}>
              {[
                ["수량", h.qty>=1?h.qty.toLocaleString(undefined,{maximumFractionDigits:4}):h.qty.toFixed(6), null],
                ["평균단가", h.isKRW?`₩${Math.round(h.avgCostKRW/h.qty).toLocaleString()}`:`$${h.avgCostUSD.toFixed(2)}`,
                  h.isKRW?`$${h.avgCostUSD.toFixed(2)}`:`₩${Math.round(h.avgCostKRW/h.qty).toLocaleString()}`],
                ["현재가", h.isKRW?(h.rawPrice?`₩${Math.round(h.rawPrice).toLocaleString()}`:"—"):(h.priceUSD?`$${h.priceUSD.toFixed(2)}`:"—"),
                  h.isKRW?(h.priceUSD?`$${h.priceUSD.toFixed(2)}`:null):(h.priceKRW?`₩${Math.round(h.priceKRW).toLocaleString()}`:null)],
                ["매입원가", fUSD(h.cost), `₩${Math.round(h.costKRW).toLocaleString()}`],
              ].map(([label,val,sub])=>(
                <div key={label} style={{background:C.bg,borderRadius:6,padding:"6px 8px"}}>
                  <div style={{fontSize:9,color:C.muted,fontWeight:600,marginBottom:2}}>{label}</div>
                  <div style={{fontSize:11,fontWeight:700,color:"#e2e8f0"}}>{val}</div>
                  {sub&&<div style={{fontSize:9,color:"#475569",marginTop:1}}>{sub}</div>}
                </div>
              ))}
            </div>

            {/* 현재가 입력 */}
            <div style={{display:"flex",gap:6,marginTop:8,alignItems:"center"}}>
              <input style={{...input,flex:1,fontSize:12,padding:"6px 10px"}}
                placeholder={h.isKRW?"현재가 (₩)":"현재가 ($)"}
                type="number"
                value={priceEdit[h.id]!==undefined?priceEdit[h.id]:(h.manualPrice?String(h.manualPrice):"")}
                onChange={e=>setPriceEdit(p=>({...p,[h.id]:e.target.value}))}/>
              <button style={{...btn("primary"),fontSize:12,padding:"6px 12px",whiteSpace:"nowrap"}} onClick={()=>handlePriceUpdate(h)}>
                {h.isKRW?"₩저장":"$저장"}
              </button>
              {h.manualPrice&&(
                <button style={{...btn("secondary"),fontSize:11,padding:"6px 8px",whiteSpace:"nowrap"}}
                  onClick={()=>setHoldings(hs=>hs.map(x=>x.id===h.id?{...x,manualPrice:null}:x))}>자동</button>
              )}
            </div>

            <div style={{display:"flex",gap:6,marginTop:8}}>
              <button style={{...btn("secondary"),fontSize:11,padding:"5px 12px"}} onClick={()=>handleEdit(h)}>✏️ 수정</button>
              <button style={{...btn("danger"),fontSize:11,padding:"5px 12px"}} onClick={()=>setConfirmDelete(h.id)}>삭제</button>
            </div>

            {confirmDelete===h.id&&(
              <div style={{marginTop:8,padding:10,background:C.bg,borderRadius:8,display:"flex",gap:8,alignItems:"center"}}>
                <span style={{fontSize:12,color:"#f87171",flex:1}}>정말 삭제?</span>
                <button style={{...btn("danger"),fontSize:12}} onClick={()=>handleDelete(h.id)}>삭제</button>
                <button style={{...btn("secondary"),fontSize:12}} onClick={()=>setConfirmDelete(null)}>취소</button>
              </div>
            )}
          </div>
          );
        })}
        <div style={{textAlign:"center",marginTop:8}}>
          <button style={btn("primary")} onClick={fetchPrices} disabled={loading}>{loading?"⟳ 조회중...":"↻ 시세 새로고침"}</button>
        </div>
      </>)}

      {/* ── ALLOCATION ── */}
      {view==="allocation" && (<>
        <div style={{background:C.card,borderRadius:12,padding:14,marginBottom:12}}>
          <div style={{fontSize:11,color:C.muted,fontWeight:600,textTransform:"uppercase",marginBottom:10}}>현재 vs 목표 비중</div>
          {allocationData.filter(a=>a.current>0||a.target>0).sort((a,b)=>b.current-a.current).map(a=>(
            <AllocationBar key={a.ticker} label={`${a.ticker} (${a.name})`} current={a.current} target={a.target}/>
          ))}
          <div style={{marginTop:10,fontSize:11,color:C.muted}}>🟡 노란선=목표 | 파란바=현재</div>
        </div>

        <div style={{background:C.card,borderRadius:12,padding:14,marginBottom:12}}>
          <div style={{fontSize:11,color:C.muted,fontWeight:600,textTransform:"uppercase",marginBottom:8}}>리밸런싱 제안</div>
          {allocationData.filter(a=>Math.abs(a.current-a.target)>2&&a.target>0).sort((a,b)=>Math.abs(b.current-b.target)-Math.abs(a.current-a.target)).map(a=>{
            const diff=a.current-a.target;
            return (
              <div key={a.ticker} style={{padding:"8px 0",borderBottom:`1px solid ${C.bg}`,fontSize:12}}>
                <div style={{display:"flex",justifyContent:"space-between"}}>
                  <span style={{fontWeight:700}}>{a.ticker}</span>
                  <span style={{color:diff>0?C.red:C.green,fontWeight:600}}>{diff>0?"▼ 매도":"▲ 매수"} {fUSD(totalValue*Math.abs(diff)/100)}</span>
                </div>
                <div style={{color:C.muted,marginTop:2}}>현재 {a.current.toFixed(1)}% → 목표 {a.target.toFixed(1)}%</div>
              </div>
            );
          })}
          {allocationData.filter(a=>Math.abs(a.current-a.target)>2&&a.target>0).length===0&&(
            <div style={{color:C.green,fontSize:13}}>✓ 모든 종목 목표 비중 ±2% 이내</div>
          )}
        </div>
      </>)}

      {/* ── ADD / EDIT ── */}
      {view==="add" && (
        <div style={{background:C.card,borderRadius:12,padding:16}}>
          <div style={{fontSize:11,color:C.muted,fontWeight:600,textTransform:"uppercase",marginBottom:14}}>{editId?"종목 수정":"종목 추가"}</div>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {[
              ["티커 심볼 *","ticker","text","예: TSLA, BTC-USD, 005930.KS"],
              ["종목명","name","text","예: Tesla, 삼성전자"],
            ].map(([label,key,type,ph])=>(
              <div key={key}>
                <div style={{fontSize:11,color:C.sub,fontWeight:600,marginBottom:4}}>{label}</div>
                <input style={input} type={type} placeholder={ph} value={form[key]} onChange={e=>setForm(f=>({...f,[key]:e.target.value}))}/>
              </div>
            ))}
            <div>
              <div style={{fontSize:11,color:C.sub,fontWeight:600,marginBottom:4}}>자산 유형 *</div>
              <select style={{...input}} value={form.type} onChange={e=>setForm(f=>({...f,type:e.target.value}))}>
                {ASSET_TYPES.map(t=><option key={t}>{t}</option>)}
              </select>
            </div>
            <div>
              <div style={{fontSize:11,color:C.sub,fontWeight:600,marginBottom:4}}>계좌 *</div>
              <select style={{...input}} value={form.account} onChange={e=>setForm(f=>({...f,account:e.target.value}))}>
                {ACCOUNTS.map(a=><option key={a}>{a}</option>)}
              </select>
            </div>
            {[
              ["수량 *","qty","number","0"],
              [`평균단가 * ${form.type==="한국주식"?"(₩)":"($)"}`, "avgCost","number","0"],
              ["목표 비중 (%)","targetPct","number","0"],
              [`현재가 ${form.type==="한국주식"?"(₩ — 필수)":"($ — 선택)"}`, "manualPrice","number",form.type==="한국주식"?"주가 입력":"비워두면 자동"],
            ].map(([label,key,type,ph])=>(
              <div key={key}>
                <div style={{fontSize:11,color:C.sub,fontWeight:600,marginBottom:4}}>{label}</div>
                <input style={input} type={type} placeholder={ph} value={form[key]} onChange={e=>setForm(f=>({...f,[key]:e.target.value}))}/>
              </div>
            ))}
            <div style={{display:"flex",gap:8,marginTop:4}}>
              <button style={{...btn("primary"),flex:1}} onClick={handleAdd}>{editId?"수정 완료":"추가"}</button>
              <button style={btn("secondary")} onClick={()=>{setView("holdings");setEditId(null);setForm({ticker:"",name:"",type:"미국주식",account:"Fidelity",qty:"",avgCost:"",targetPct:"",manualPrice:""});}}>취소</button>
            </div>
          </div>
        </div>
      )}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
