// ── 유틸 ──────────────────────────────────────────────
function fUSD(n,d=2){
  if(n==null)return"—";
  const a=Math.abs(n);
  if(a>=1e6)return`$${n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`;
  return`$${n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`;
}
function fKRW(n){if(n==null)return"—"; return`₩${Math.round(n).toLocaleString()}`;}
function fPct(n){if(n==null)return"—"; return`${n>=0?"+":""}${n.toFixed(2)}%`;}
function today(){return new Date().toISOString().slice(0,10);}
function loadJSON(key,def){try{const s=localStorage.getItem(key);return s?JSON.parse(s):def;}catch{return def;}}
function saveJSON(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch{}}

// ── Firebase 동기화 ──
async function saveToCloud(holdings){
  try{
    await db.collection("portfolio").doc("holdings").set({
      data: JSON.stringify(holdings),
      updatedAt: new Date().toISOString()
    });
    return true;
  }catch(e){console.error("Cloud save error:",e);return false;}
}
async function loadFromCloud(){
  try{
    const doc=await db.collection("portfolio").doc("holdings").get();
    if(doc.exists){
      const d=doc.data();
      return JSON.parse(d.data);
    }
  }catch(e){console.error("Cloud load error:",e);}
  return null;
}

        await Promise.all(chunks.map(async chunk=>{
          const syms=chunk.join(",");
          try{
            // 방법1: Yahoo Finance v7 (CORS 허용)
            const r=await fetch(`https://query1.finance.yahoo.com/v7/finance/quote?symbols=${syms}&fields=regularMarketPrice,previousClose`,{mode:"cors"});
            const d=await r.json();
            const results=d?.quoteResponse?.result||[];

                np[q.symbol]=q.regularMarketPrice;

            await Promise.all(chunk.map(async t=>{
              try{
                const r2=await fetch(`https://query2.finance.yahoo.com/v8/finance/chart/${t}?interval=1d&range=2d`,{mode:"cors"});
                const d2=await r2.json();
                const meta=d2?.chart?.result?.[0]?.meta;
                if(meta?.regularMarketPrice>0){
                  np[t]=meta.regularMarketPrice;
                  if(meta?.chartPreviousClose>0) np[`${t}_prev`]=meta.chartPreviousClose;
                }
              }catch{}
            }));
          }
        }));
      }

      // 전일 스냅샷 저장

        });
        saveJSON(DK,newSnap);
        setPrevPrices(newSnap);
      }

      setLastUpd(new Date());
    }catch(e){console.error("fetch error:",e);}

    const toDate=new Date(); toDate.setFullYear(toDate.getFullYear()+1);
    const from=fromDate.toISOString().slice(0,10);
    const to=toDate.toISOString().slice(0,10);

    await Promise.all(tickers.map(async t=>{
      if(dd[t]&&dd[t].fetched) return; // 이미 있으면 스킵
      try{
        const r=await fetch(`https://finnhub.io/api/v1/stock/dividend2?symbol=${t}&token=${FINNHUB_KEY}`);

        } else {
          // KNOWN_DIVIDENDS fallback
          if(KNOWN_DIVIDENDS[t]) dd[t]={known:KNOWN_DIVIDENDS[t],fetched:true};
          else dd[t]={records:[],fetched:true};
        }
      }catch{
        if(KNOWN_DIVIDENDS[t]) dd[t]={known:KNOWN_DIVIDENDS[t],fetched:true};
      }
    }));
    setDivData(dd);
    saveJSON(DIVK,dd);
  },[holdings,divData]);

  useEffect(()=>{
    fetchPrices();
    // 5분마다 자동 새로고침
    const timer=setInterval(()=>fetchPrices(),5*60*1000);
    return()=>clearInterval(timer);
  },[]);

  const getPrice=h=>h.manualPrice||(prices[h.ticker])||null;
  const getPrevPrice=h=>{
    if(prevPrices?.prices?.[h.ticker]) return prevPrices.prices[h.ticker];
    const pp=prices[`${h.ticker}_prev`];
    if(pp) return pp;
    return null;
  };

  const enriched=useMemo(()=>holdings.map(h=>{
    const raw=getPrice(h);
    const isKRW=h.type==="한국주식";
    const priceUSD=isKRW?(raw?raw/usdKrw:null):raw;
    const priceKRW=isKRW?raw:(raw?raw*usdKrw:null);
    const avgUSD=isKRW?h.avgCost/usdKrw:h.avgCost;
    const avgKRW=isKRW?h.avgCost:h.avgCost*usdKrw;
    const value=priceUSD!=null?priceUSD*h.qty:null;
    const cost=avgUSD*h.qty;
    const pnl=value!=null?value-cost:null;
    const pnlPct=(pnl!=null&&cost>0)?(pnl/cost)*100:null;

    // 일간 손익
    const prevRaw=getPrevPrice(h);
    const prevUSD=isKRW?(prevRaw?prevRaw/usdKrw:null):prevRaw;
    const prevValue=prevUSD!=null?prevUSD*h.qty:null;
    const dailyPnl=(value!=null&&prevValue!=null)?value-prevValue:null;
    const dailyPct=(dailyPnl!=null&&prevValue>0)?(dailyPnl/prevValue)*100:null;

    // 배당
    const divInfo=divData[h.ticker];
    const knownDiv=KNOWN_DIVIDENDS[h.ticker];
    let annualDiv=0;
    if(divInfo?.records?.length>0){
      const recent=divInfo.records.filter(d=>d.amount>0);
      if(recent.length>0) annualDiv=recent[0].amount*(recent[0].frequency||4);
    } else if(knownDiv) annualDiv=knownDiv.annual||0;
    const annualDivTotal=annualDiv*h.qty;
    const divYield=priceUSD>0?(annualDiv/priceUSD)*100:0;

    return{...h,raw,priceUSD,priceKRW,avgUSD,avgKRW,value,cost,pnl,pnlPct,dailyPnl,dailyPct,prevValue,isKRW,annualDiv,annualDivTotal,divYield};
  }),[holdings,prices,prevPrices,usdKrw,divData]);

  const totalValue=enriched.reduce((s,h)=>s+(h.value||0),0);
  const totalCost=enriched.reduce((s,h)=>s+h.cost,0);
  const totalPnl=totalValue-totalCost;
  const totalPnlPct=totalCost>0?(totalPnl/totalCost)*100:0;
  const totalDailyPnl=enriched.reduce((s,h)=>s+(h.dailyPnl||0),0);
  const totalPrevValue=enriched.reduce((s,h)=>s+(h.prevValue||0),0);
  const totalDailyPct=totalPrevValue>0?(totalDailyPnl/totalPrevValue)*100:0;
  const totalAnnualDiv=enriched.reduce((s,h)=>s+h.annualDivTotal,0);
  const byAccount=ACCOUNTS.map(a=>({
    account:a,
    value:enriched.filter(h=>h.account===a).reduce((s,h)=>s+(h.value||0),0),
    cost:enriched.filter(h=>h.account===a).reduce((s,h)=>s+h.cost,0),
    pnl:enriched.filter(h=>h.account===a).reduce((s,h)=>s+(h.pnl||0),0),
    dailyPnl:enriched.filter(h=>h.account===a).reduce((s,h)=>s+(h.dailyPnl||0),0),
    count:enriched.filter(h=>h.account===a).length,
  })).filter(a=>a.value>0||a.count>0);

  const sortedHoldings=useMemo(()=>{
    return[...enriched].sort((a,b)=>{
      if(priceSort==="daily") return(b.dailyPnl||0)-(a.dailyPnl||0);
      if(priceSort==="total") return(b.pnl||0)-(a.pnl||0);
      return(b.value||0)-(a.value||0);
    });
  },[enriched,priceSort]);

  // ── 수출/수입 ──
  const exportData=()=>{
    const blob=new Blob([JSON.stringify({holdings,exportedAt:new Date().toISOString()},null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=`palazzo_${today()}.json`;a.click();
  };
  const importData=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{try{const p=JSON.parse(ev.target.result);if(p.holdings){setHoldings(p.holdings);alert(`✅ ${p.holdings.length}개 종목 복원`);}}catch{alert("❌ 오류");}};
    r.readAsText(f);e.target.value="";
  };

  return(
    <div style={{background:"#0a0f1e",minHeight:"100dvh",paddingBottom:80}}>
      {tab==="home"&&<HomeTab enriched={enriched} totalValue={totalValue} totalCost={totalCost} totalPnl={totalPnl} totalPnlPct={totalPnlPct} totalDailyPnl={totalDailyPnl} totalDailyPct={totalDailyPct} totalAnnualDiv={totalAnnualDiv} usdKrw={usdKrw} loading={loading} lastUpd={lastUpd} onRefresh={fetchPrices} sortedHoldings={sortedHoldings} priceSort={priceSort} setPriceSort={setPriceSort} holdingView={holdingView} setHoldingView={setHoldingView} onSelect={setSelectedH} exportData={exportData} importData={importData} byAccount={byAccount} cloudStatus={cloudStatus}/>}
      {tab==="dividend"&&<DividendTab enriched={enriched} usdKrw={usdKrw} totalAnnualDiv={totalAnnualDiv} onFetch={fetchDividends} divData={divData}/>}
      {tab==="allocation"&&<AllocationTab enriched={enriched} totalValue={totalValue}/>}
      {tab==="holdings"&&<HoldingsTab enriched={enriched} holdings={holdings} setHoldings={setHoldings} usdKrw={usdKrw} totalValue={totalValue}/>}

      {selectedH&&<DetailModal h={selectedH} onClose={()=>setSelectedH(null)} usdKrw={usdKrw} divData={divData}/>}

      <nav className="tab-bar">
        {[["home","🏠","홈"],["dividend","💰","배당"],["allocation","🥧","비중"],["holdings","📋","종목"]].map(([k,icon,label])=>(
          <button key={k} className={`tab-btn${tab===k?" active":""}`} onClick={()=>setTab(k)}>
            <span className="tab-icon">{icon}</span>{label}
          </button>
        ))}
      </nav>
    </div>
  );
}

// ── 배당 탭 ──────────────────────────────────────────────
function DividendTab({enriched,usdKrw,totalAnnualDiv,onFetch,divData}){
  const [selMonth,setSelMonth]=useState(new Date().getMonth()); // 0-11

  // 월별 배당 예정 계산
  const monthlyDiv=useMemo(()=>{
    const byMonth=Array(12).fill(0);
    enriched.forEach(h=>{
      if(!h.annualDivTotal) return;
      const known=KNOWN_DIVIDENDS[h.ticker];
      if(known?.months?.length>0){
        known.months.forEach(m=>{ byMonth[m-1]+=h.annualDivTotal/known.months.length; });
      } else if(h.annualDivTotal>0){
        // 균등 분배
        for(let i=0;i<12;i++) byMonth[i]+=h.annualDivTotal/12;
      }
    });
    return byMonth;
  },[enriched]);

  const maxDiv=Math.max(...monthlyDiv,1);
  const thisMonthDiv=monthlyDiv[selMonth];

  // 선택된 달에 배당 받는 종목
  const monthHoldings=enriched.filter(h=>{
    if(!h.annualDivTotal) return false;
    const known=KNOWN_DIVIDENDS[h.ticker];
    if(known?.months?.length>0) return known.months.includes(selMonth+1);
    return h.annualDivTotal>0;
  });

  return(
    <div style={{padding:"0 14px 14px"}}>
      <div className="safe-top" style={{marginBottom:16}}>
        <div style={{fontSize:10,color:"#64748b",fontWeight:700,letterSpacing:1}}>DIVIDEND</div>
        <div style={{fontSize:18,fontWeight:800}}>배당 수익</div>
      </div>

      {/* 연간 배당 요약 */}
      <div className="card" style={{background:"linear-gradient(135deg,#1a1a0a,#131c2e)",border:"1px solid #2a2a0f"}}>
        <div className="section-title" style={{color:"#f59e0b"}}>연간 배당 예상</div>
        <div style={{fontSize:28,fontWeight:900,color:"#f59e0b"}}>{fUSD(totalAnnualDiv)}</div>
        <div style={{fontSize:13,color:"#64748b",marginTop:2}}>≈ ₩{(totalAnnualDiv*usdKrw/1e4).toFixed(0)}만</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:12}}>
          <div style={{background:"rgba(0,0,0,0.3)",borderRadius:8,padding:"8px 10px"}}>
            <div style={{fontSize:9,color:"#64748b",marginBottom:2}}>월 평균</div>
            <div style={{fontSize:14,fontWeight:700,color:"#f59e0b"}}>{fUSD(totalAnnualDiv/12)}</div>
          </div>
          <div style={{background:"rgba(0,0,0,0.3)",borderRadius:8,padding:"8px 10px"}}>
            <div style={{fontSize:9,color:"#64748b",marginBottom:2}}>배당 수익률</div>
            <div style={{fontSize:14,fontWeight:700,color:"#f59e0b"}}>
              {totalAnnualDiv>0&&enriched.reduce((s,h)=>s+(h.value||0),0)>0
                ?(totalAnnualDiv/enriched.reduce((s,h)=>s+(h.value||0),0)*100).toFixed(2)+"%"
                :"0.00%"}
            </div>
          </div>
        </div>
      </div>

      {/* 월별 배당 바 차트 */}
      <div className="card">
        <div className="section-title">월별 배당 스케줄</div>
        <div style={{display:"flex",gap:4,alignItems:"flex-end",height:80,marginBottom:8}}>
          {monthlyDiv.map((v,i)=>(
            <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,cursor:"pointer"}} onClick={()=>setSelMonth(i)}>
              <div style={{width:"100%",background:selMonth===i?"#f59e0b":v>0?"#854d0e":"#1e293b",borderRadius:"3px 3px 0 0",height:`${Math.max((v/maxDiv)*64,2)}px`,transition:"height 0.3s"}}/>
              <div style={{fontSize:9,color:selMonth===i?"#f59e0b":"#64748b",fontWeight:selMonth===i?700:400}}>{i+1}월</div>
            </div>
          ))}
        </div>
        <div style={{textAlign:"center",padding:"8px",background:"#0a0f1e",borderRadius:8}}>
          <span style={{fontSize:12,color:"#94a3b8"}}>{selMonth+1}월 예상 배당: </span>
          <span style={{fontSize:14,fontWeight:700,color:"#f59e0b"}}>{fUSD(thisMonthDiv)}</span>
        </div>
      </div>

      {/* 선택된 달 배당 종목 */}
      <div className="card">
        <div className="section-title">{selMonth+1}월 배당 예정 종목</div>
        {monthHoldings.length===0?(
          <div style={{color:"#334155",fontSize:13,textAlign:"center",padding:"20px 0"}}>이 달은 배당 없음</div>
        ):monthHoldings.map(h=>{
          const known=KNOWN_DIVIDENDS[h.ticker];
          const perShare=known?known.annual/(known.months?.length||4):0;
          const myDiv=perShare*h.qty;
          return(
            <div key={h.id} className="holding-row">
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <div style={{width:34,height:34,borderRadius:8,background:COLORS[h.type]||"#334155",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800,color:"#fff"}}>
                  {h.ticker.slice(0,2)}
                </div>
                <div>
                  <div style={{fontWeight:700,fontSize:13}}>{h.ticker}</div>
                  <div style={{fontSize:11,color:"#64748b"}}>주당 ${perShare.toFixed(3)} × {h.qty.toLocaleString(undefined,{maximumFractionDigits:2})}주</div>
                </div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontWeight:700,fontSize:14,color:"#f59e0b"}}>{fUSD(myDiv)}</div>
                <div style={{fontSize:11,color:"#64748b"}}>연 {fUSD(h.annualDivTotal)}</div>
              </div>
            </div>
          );
        })}
        <button onClick={onFetch} style={{marginTop:10,width:"100%",padding:"8px",borderRadius:8,border:"1px dashed #334155",background:"transparent",color:"#64748b",fontSize:11,cursor:"pointer"}}>
          ↻ 배당 데이터 업데이트
        </button>
      </div>

      {/* 배당 TOP 종목 */}
      <div className="card">
        <div className="section-title">배당 수익 TOP 종목</div>
        {[...enriched].filter(h=>h.annualDivTotal>0).sort((a,b)=>b.annualDivTotal-a.annualDivTotal).slice(0,8).map(h=>(
          <div key={h.id} className="holding-row">
            <div>
              <div style={{fontWeight:700,fontSize:13}}>{h.ticker} <span style={{fontSize:11,color:"#64748b"}}>{h.name}</span></div>
              <div style={{fontSize:11,color:"#64748b"}}>배당수익률 {h.divYield.toFixed(2)}%</div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontWeight:700,color:"#f59e0b"}}>{fUSD(h.annualDivTotal)}</div>
              <div style={{fontSize:11,color:"#64748b"}}>연간</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── 비중 탭 ──────────────────────────────────────────────
function AllocationTab({enriched,totalValue}){
  const [view,setView]=useState("type"); // type | account | stock

  const byType=TYPES.map(t=>({label:t,value:enriched.filter(h=>h.type===t).reduce((s,h)=>s+(h.value||0),0),color:COLORS[t]})).filter(d=>d.value>0);
  const byAccount=ACCOUNTS.map(a=>({label:a,value:enriched.filter(h=>h.account===a).reduce((s,h)=>s+(h.value||0),0),color:"#3b82f6"})).filter(d=>d.value>0);

  const data=view==="type"?byType:view==="account"?byAccount:[...enriched].filter(h=>h.value>0).sort((a,b)=>b.value-a.value).slice(0,15).map(h=>({label:h.ticker,value:h.value||0,color:COLORS[h.type]}));

  return(
    <div style={{padding:"0 14px 14px"}}>
      <div className="safe-top" style={{marginBottom:16}}>
        <div style={{fontSize:10,color:"#64748b",fontWeight:700,letterSpacing:1}}>PORTFOLIO</div>
        <div style={{fontSize:18,fontWeight:800}}>자산 비중</div>
      </div>

      <div style={{display:"flex",gap:8,marginBottom:12}}>
        {[["type","유형별"],["account","계좌별"],["stock","종목별"]].map(([k,l])=>(
          <button key={k} className={`chip${view===k?" active":""}`} onClick={()=>setView(k)}>{l}</button>
        ))}
      </div>

      {/* 도넛 차트 */}
      <div className="card">
        <DonutChart data={data} total={totalValue}/>
      </div>

      {/* 비중 바 리스트 */}
      <div className="card">
        {data.sort((a,b)=>b.value-a.value).map((d,i)=>{
          const pct=totalValue>0?(d.value/totalValue)*100:0;
          return(

              <div style={{display:"flex",justifyContent:"space-between",marginBottom:4,fontSize:13}}>
                <span style={{fontWeight:600}}>{d.label}</span>
                <span style={{color:"#94a3b8"}}>{pct.toFixed(1)}% <span style={{color:"#64748b",fontSize:11}}>({fUSD(d.value)})</span></span>
              </div>
              <div style={{height:6,background:"#1e293b",borderRadius:3}}>

            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── 종목 관리 탭 ──────────────────────────────────────────────
function HoldingsTab({enriched,holdings,setHoldings,usdKrw,totalValue}){
  const [mode,setMode]=useState("list"); // list | add | edit
  const [editTarget,setEditTarget]=useState(null);
  const [form,setForm]=useState({ticker:"",name:"",type:"미국주식",account:"Individual",qty:"",avgCost:"",targetPct:"",manualPrice:""});
  const [priceEdit,setPriceEdit]=useState({});
  const [confirmDel,setConfirmDel]=useState(null);
  const [filterType,setFilterType]=useState("전체");

  const openEdit=h=>{
    setForm({ticker:h.ticker,name:h.name,type:h.type,account:h.account,qty:String(h.qty),avgCost:String(h.avgCost),targetPct:String(h.targetPct||""),manualPrice:h.manualPrice?String(h.manualPrice):""});
    setEditTarget(h.id);setMode("edit");
  };
  const save=()=>{
    if(!form.ticker||!form.qty||!form.avgCost)return;
    const newH={id:editTarget||Date.now(),ticker:form.ticker.toUpperCase(),name:form.name||form.ticker.toUpperCase(),type:form.type,account:form.account,qty:parseFloat(form.qty),avgCost:parseFloat(form.avgCost),targetPct:parseFloat(form.targetPct)||0,manualPrice:form.manualPrice?parseFloat(form.manualPrice):null};
    setHoldings(hs=>editTarget?hs.map(x=>x.id===editTarget?newH:x):[...hs,newH]);
    setMode("list");setEditTarget(null);setForm({ticker:"",name:"",type:"미국주식",account:"Individual",qty:"",avgCost:"",targetPct:"",manualPrice:""});
  };

  const filtered=enriched.filter(h=>filterType==="전체"||h.type===filterType);

  if(mode==="add"||mode==="edit") return(
    <div style={{padding:"0 14px 14px"}}>
      <div className="safe-top" style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
        <button onClick={()=>{setMode("list");setEditTarget(null);}} style={{background:"transparent",border:"none",color:"#3b82f6",fontSize:16,cursor:"pointer"}}>← 취소</button>
        <div style={{fontSize:16,fontWeight:800}}>{mode==="edit"?"종목 수정":"종목 추가"}</div>
      </div>
      {[["티커 *","ticker","text","TSLA, BTC-USD, 005930.KS"],["종목명","name","text","Tesla, 삼성전자"],["수량 *","qty","number","0"],
        [`평균단가 * ${form.type==="한국주식"?"(₩)":"($)"}`,"avgCost","number","0"],
        ["목표비중(%)","targetPct","number","0"],
        [`현재가 ${form.type==="한국주식"?"(₩ 필수)":"($ 선택)"}`,"manualPrice","number","비워두면 자동"]
      ].map(([label,key,type,ph])=>(
        <div key={key} className="field">
          <label>{label}</label>
          <input type={type} placeholder={ph} value={form[key]} onChange={e=>setForm(f=>({...f,[key]:e.target.value}))}/>
        </div>
      ))}
      <div className="field"><label>자산 유형</label><select value={form.type} onChange={e=>setForm(f=>({...f,type:e.target.value}))}>{TYPES.map(t=><option key={t}>{t}</option>)}</select></div>
      <div className="field"><label>계좌</label>
        <select value={form.account} onChange={e=>setForm(f=>({...f,account:e.target.value}))}>
          {Object.entries(ACCOUNT_GROUPS).map(([group,accts])=>(
            <optgroup key={group} label={group}>
              {accts.map(a=><option key={a} value={a}>{a}</option>)}
            </optgroup>
          ))}
        </select></div>
      <button className="btn-primary" onClick={save}>{mode==="edit"?"수정 완료":"추가"}</button>
    </div>
  );

  return(
    <div style={{padding:"0 14px 14px"}}>
      <div className="safe-top" style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div>
          <div style={{fontSize:10,color:"#64748b",fontWeight:700,letterSpacing:1}}>HOLDINGS</div>
          <div style={{fontSize:18,fontWeight:800}}>보유 종목</div>
        </div>
        <button onClick={()=>setMode("add")} style={{background:"#3b82f6",color:"#fff",border:"none",borderRadius:10,padding:"8px 16px",fontSize:13,fontWeight:700,cursor:"pointer"}}>+ 추가</button>
      </div>

      <div className="scroll-x" style={{marginBottom:12}}>
        {["전체",...TYPES].map(t=>(
          <button key={t} className={`chip${filterType===t?" active":""}`} onClick={()=>setFilterType(t)}>{t}</button>
        ))}
      </div>

      {filtered.map(h=>{
        const weight=totalValue>0?((h.value||0)/totalValue*100):0;
        return(
          <div key={h.id} className="card" style={{padding:"12px 14px",marginBottom:8,borderLeft:`3px solid ${COLORS[h.type]||"#334155"}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
              <div>
                <span style={{fontWeight:800,fontSize:15}}>{h.ticker}</span>
                <span style={{fontSize:11,color:"#64748b",marginLeft:6}}>{h.name}</span>
                <div style={{marginTop:4,display:"flex",gap:5}}>
                  <span className="badge" style={{background:(COLORS[h.type]||"#888")+"22",color:COLORS[h.type]||"#888"}}>{h.type}</span>
                  <span style={{fontSize:10,color:"#475569"}}>{h.account}</span>
                  <span style={{fontSize:10,color:"#64748b"}}>{weight.toFixed(1)}%</span>
                </div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:15,fontWeight:800}}>{h.value!=null?fUSD(h.value):<span style={{color:"#334155"}}>—</span>}</div>
                {h.pnl!=null&&<div style={{fontSize:12,color:h.pnl>=0?"#22c55e":"#ef4444"}}>{h.pnl>=0?"+":""}{fUSD(h.pnl)} ({fPct(h.pnlPct)})</div>}
                {h.dailyPnl!=null&&<div style={{fontSize:11,color:h.dailyPnl>=0?"#22c55e":"#ef4444"}}>일간 {h.dailyPnl>=0?"+":""}{fUSD(h.dailyPnl)}</div>}
              </div>
            </div>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:6,marginBottom:10}}>
              {[
                ["수량",h.qty>=1?h.qty.toLocaleString(undefined,{maximumFractionDigits:3}):h.qty.toFixed(6)],
                ["평균단가",h.isKRW?fKRW(h.avgCost):`$${h.avgUSD.toFixed(2)}`],
                ["현재가",h.isKRW?(h.raw?fKRW(h.raw):"—"):(h.priceUSD?`$${h.priceUSD.toFixed(2)}`:"—")],
                ["매입원가",fUSD(h.cost)],
              ].map(([l,v])=>(
                <div key={l} style={{background:"#0a0f1e",borderRadius:6,padding:"6px 8px"}}>
                  <div style={{fontSize:9,color:"#64748b",marginBottom:2}}>{l}</div>
                  <div style={{fontSize:11,fontWeight:700}}>{v}</div>
                </div>
              ))}
            </div>

            {/* 현재가 직접 입력 */}
            <div style={{display:"flex",gap:6,marginBottom:8}}>
              <input style={{flex:1,background:"#0a0f1e",border:"1px solid #1e293b",borderRadius:7,padding:"7px 10px",color:"#f1f5f9",fontSize:12}} type="number"
                placeholder={h.isKRW?"현재가 (₩)":"현재가 ($)"}
                value={priceEdit[h.id]!==undefined?priceEdit[h.id]:(h.manualPrice?String(h.manualPrice):"")}
                onChange={e=>setPriceEdit(p=>({...p,[h.id]:e.target.value}))}/>
              <button style={{background:"#3b82f6",color:"#fff",border:"none",borderRadius:7,padding:"7px 12px",fontSize:12,fontWeight:600,cursor:"pointer"}} onClick={()=>{
                const v=parseFloat(priceEdit[h.id]);if(!v)return;
                setHoldings(hs=>hs.map(x=>x.id===h.id?{...x,manualPrice:v}:x));
                setPriceEdit(p=>({...p,[h.id]:""}));
              }}>{h.isKRW?"₩저장":"$저장"}</button>
              {h.manualPrice&&<button style={{background:"#1e293b",color:"#94a3b8",border:"none",borderRadius:7,padding:"7px 8px",fontSize:11,cursor:"pointer"}} onClick={()=>setHoldings(hs=>hs.map(x=>x.id===h.id?{...x,manualPrice:null}:x))}>자동</button>}
            </div>

            <div style={{display:"flex",gap:6}}>
              <button className="btn-secondary" style={{fontSize:12,padding:"7px 14px"}} onClick={()=>openEdit(h)}>✏️ 수정</button>
              <button className="btn-danger" style={{fontSize:12,padding:"7px 14px"}} onClick={()=>setConfirmDel(h.id)}>삭제</button>
            </div>
            {confirmDel===h.id&&(
              <div style={{marginTop:8,padding:10,background:"#0a0f1e",borderRadius:8,display:"flex",gap:8,alignItems:"center"}}>
                <span style={{fontSize:12,color:"#f87171",flex:1}}>정말 삭제?</span>
                <button className="btn-danger" style={{fontSize:12,padding:"6px 12px"}} onClick={()=>{setHoldings(hs=>hs.filter(x=>x.id!==h.id));setConfirmDel(null);}}>삭제</button>
                <button className="btn-secondary" style={{fontSize:12,padding:"6px 12px"}} onClick={()=>setConfirmDel(null)}>취소</button>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ── 도넛 차트 ──────────────────────────────────────────────
function DonutChart({data,total}){
  if(!total||data.length===0) return null;
  let cum=0;
  const slices=data.map(d=>{const pct=d.value/total;const s=cum;cum+=pct;return{...d,pct,start:s};});
  const r=75,cx=100,cy=100,sw=24;
  const arc=(s,e)=>{
    const a1=s*2*Math.PI-Math.PI/2,a2=e*2*Math.PI-Math.PI/2;
    const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    return`M ${x1} ${y1} A ${r} ${r} 0 ${(e-s)>0.5?1:0} 1 ${x2} ${y2}`;
  };
  return(
    <div style={{display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
      <svg width={200} height={200}>
        {slices.map((s,i)=>(
          <path key={i} d={arc(s.start,s.start+s.pct)} fill="none" stroke={s.color||"#888"} strokeWidth={sw} strokeLinecap="butt"/>
        ))}
        <text x={cx} y={cy-8} textAnchor="middle" fill="#64748b" fontSize={11}>총자산</text>
        <text x={cx} y={cy+9} textAnchor="middle" fill="#f1f5f9" fontSize={13} fontWeight={700}>{fUSD(total)}</text>
      </svg>
      <div style={{display:"flex",flexDirection:"column",gap:6,flex:1}}>
        {slices.sort((a,b)=>b.pct-a.pct).map((s,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:8,fontSize:12}}>
            <div style={{width:10,height:10,borderRadius:2,background:s.color||"#888",flexShrink:0}}/>
            <span style={{color:"#94a3b8",flex:1,fontSize:11}}>{s.label}</span>
            <span style={{color:"#f1f5f9",fontWeight:700}}>{(s.pct*100).toFixed(1)}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}
