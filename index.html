input,select,button,textarea{font-family:inherit;outline:none}

.hrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #0a0f1e}
.hrow:last-child{border-bottom:none}
.chip{display:inline-flex;align-items:center;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid #1e293b;background:transparent;color:#94a3b8;white-space:nowrap}
.chip.active{background:#3b82f6;border-color:#3b82f6;color:#fff}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:#94a3b8;font-weight:600;margin-bottom:5px}
.field input,.field select{width:100%;background:#0a0f1e;border:1px solid #1e293b;border-radius:10px;padding:11px 14px;color:#f1f5f9;font-size:14px}
.btn-p{background:#3b82f6;color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;width:100%}
.btn-s{background:#1e293b;color:#94a3b8;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer}

.spinner{display:inline-block;width:12px;height:12px;border:2px solid #334155;border-top-color:#3b82f6;border-radius:50%;animation:spin .8s linear infinite}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:flex-end}
.modal-box{background:#131c2e;border-radius:20px 20px 0 0;padding:20px 16px 44px;width:100%;max-height:90vh;overflow-y:auto}

// ── 유틸 ──
function fUSD(n){if(n==null)return"—";return`$${n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`;}
function fKRW(n){if(n==null)return"—";return`₩${Math.round(n).toLocaleString()}`;}
function fPct(n){if(n==null)return"—";return`${n>=0?"+":""}${n.toFixed(2)}%`;}
function today(){return new Date().toISOString().slice(0,10);}
function load(k,d){try{const s=localStorage.getItem(k);return s?JSON.parse(s):d;}catch{return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

// Firebase
async function cloudSave(holdings,realized){
  try{await db.collection("palazzo").doc("data").set({holdings:JSON.stringify(holdings),realized:JSON.stringify(realized),updatedAt:new Date().toISOString()});return true;}
  catch(e){console.error(e);return false;}
}
async function cloudLoad(){
  try{const d=await db.collection("palazzo").doc("data").get();if(d.exists){const r=d.data();return{holdings:JSON.parse(r.holdings||"[]"),realized:JSON.parse(r.realized||"[]")};}return null;}
  catch(e){console.error(e);return null;}
}

// ── 메인 앱 ──

  const [loading,setLoading]=useState(false);
  const [lastUpd,setLastUpd]=useState(null);
  const [cloudStatus,setCloudStatus]=useState("");
  const [cloudReady,setCloudReady]=useState(false);
  const [selH,setSelH]=useState(null);
  const [chartData,setChartData]=useState(()=>load(CK,[])); // [{date,value,cost}]
  const [showAddRealized,setShowAddRealized]=useState(false);

  // 클라우드 초기 로드
  useEffect(()=>{
    cloudLoad().then(data=>{
      if(data&&data.holdings&&data.holdings.length>0){
        setHoldings(data.holdings);save(SK,data.holdings);
        if(data.realized&&data.realized.length>0){setRealized(data.realized);save(RK,data.realized);}
        setCloudStatus("☁️ 동기화됨");setTimeout(()=>setCloudStatus(""),3000);
      }
      // 차트 데이터도 Firebase에서 로드
      db.collection("palazzo").doc("chart").get().then(doc=>{
        if(doc.exists){
          const d=JSON.parse(doc.data().data||"[]");
          if(d.length>0){setChartData(d);save(CK,d);}
        }
      }).catch(()=>{});
      setCloudReady(true);
    });
  },[]);

  // 변경시 저장
  useEffect(()=>{
    save(SK,holdings);
    if(!cloudReady)return;
    setCloudStatus("저장중...");
    cloudSave(holdings,realized).then(ok=>{
      setCloudStatus(ok?"☁️ 저장됨":"💾 로컬저장");
      setTimeout(()=>setCloudStatus(""),3000);
    });
  },[holdings,realized]);

  // 자산 추이 저장 - TV가 업데이트될 때 (새로고침 후)
  const chartSavedToday=useRef(false);
  useEffect(()=>{
    if(TV<=0||!cloudReady) return;
    const todayStr=today();
    setChartData(prev=>{
      if(prev.find(d=>d.date===todayStr)) return prev; // 오늘 이미 저장
      if(chartSavedToday.current) return prev;
      chartSavedToday.current=true;
      const updated=[...prev,{date:todayStr,value:TV,cost:TC}].slice(-365);
      save(CK,updated);
      db.collection("palazzo").doc("chart").set({data:JSON.stringify(updated),updatedAt:new Date().toISOString()}).catch(()=>{});
      return updated;
    });
  },[TV]);

  const getPrice=h=>h.manualPrice||prices[h.ticker]||null;
  const getPrev=h=>prevSnap?.prices?.[h.ticker]||prices[`${h.ticker}_prev`]||null;

  // 실시간 시세
  const fetchPrices=useCallback(async()=>{
    setLoading(true);
    try{
      // 환율
      try{const r=await fetch("https://query1.finance.yahoo.com/v8/finance/chart/KRW=X?interval=1d&range=1d",{mode:"cors"});const d=await r.json();const fx=d?.chart?.result?.[0]?.meta?.regularMarketPrice;if(fx>900)setUsdKrw(fx);}catch{}
      const np={};
      const autoH=holdings.filter(h=>h.type!=="한국주식"&&!h.manualPrice);
      if(autoH.length>0){
        const chunks=[];for(let i=0;i<autoH.length;i+=10)chunks.push(autoH.slice(i,i+10));
        await Promise.all(chunks.map(async ch=>{
          try{
            const syms=ch.map(h=>h.ticker).join(",");
            const r=await fetch(`https://query1.finance.yahoo.com/v7/finance/quote?symbols=${syms}`,{mode:"cors"});
            const d=await r.json();
            (d?.quoteResponse?.result||[]).forEach(q=>{
              if(q.regularMarketPrice>0){np[q.symbol]=q.regularMarketPrice;if(q.regularMarketPreviousClose>0)np[`${q.symbol}_prev`]=q.regularMarketPreviousClose;}
            });
          }catch{
            await Promise.all(ch.map(async h=>{
              try{const r=await fetch(`https://query2.finance.yahoo.com/v8/finance/chart/${h.ticker}?interval=1d&range=2d`,{mode:"cors"});const d=await r.json();const m=d?.chart?.result?.[0]?.meta;if(m?.regularMarketPrice>0){np[h.ticker]=m.regularMarketPrice;if(m.chartPreviousClose>0)np[`${h.ticker}_prev`]=m.chartPreviousClose;}}catch{}
            }));
          }
        }));
      }
      // 전일 스냅샷
      const snap=load(DK,{});
      if(!snap.date||snap.date!==today()){
        const ns={date:today(),prices:{}};
        holdings.forEach(h=>{const p=np[`${h.ticker}_prev`]||np[h.ticker]||h.manualPrice;if(p)ns.prices[h.ticker]=p;});
        save(DK,ns);setPrevSnap(ns);
      }
      setPrices(np);setLastUpd(new Date());
    }catch{}
    setLoading(false);
  },[holdings]);

  useEffect(()=>{fetchPrices();const t=setInterval(fetchPrices,5*60*1000);return()=>clearInterval(t);},[]);

  const enriched=useMemo(()=>holdings.map(h=>{
    const raw=getPrice(h);const isKRW=h.type==="한국주식";
    const pUSD=isKRW?(raw?raw/usdKrw:null):raw;
    const pKRW=isKRW?raw:(raw?raw*usdKrw:null);
    const aUSD=isKRW?h.avgCost/usdKrw:h.avgCost;
    const aKRW=isKRW?h.avgCost:h.avgCost*usdKrw;
    const value=pUSD!=null?pUSD*h.qty:null;
    const cost=aUSD*h.qty;
    const pnl=value!=null?value-cost:null;
    const pnlPct=(pnl!=null&&cost>0)?(pnl/cost)*100:null;
    const prev=getPrev(h);
    const prevUSD=isKRW?(prev?prev/usdKrw:null):prev;
    const prevVal=prevUSD!=null?prevUSD*h.qty:null;
    const dPnl=(value!=null&&prevVal!=null)?value-prevVal:null;
    const dPct=(dPnl!=null&&prevVal>0)?(dPnl/prevVal)*100:null;
    const kd=KDIV[h.ticker];
    const annDiv=kd?kd.a*h.qty:0;
    const divYield=pUSD>0&&kd?(kd.a/pUSD)*100:0;
    return{...h,raw,pUSD,pKRW,aUSD,aKRW,value,cost,pnl,pnlPct,dPnl,dPct,prevVal,isKRW,annDiv,divYield};
  }),[holdings,prices,prevSnap,usdKrw]);

  const TV=enriched.reduce((s,h)=>s+(h.value||0),0);
  const TC=enriched.reduce((s,h)=>s+h.cost,0);
  const TP=TV-TC;
  const TPP=TC>0?(TP/TC)*100:0;
  const TDP=enriched.reduce((s,h)=>s+(h.dPnl||0),0);
  const TPREV=enriched.reduce((s,h)=>s+(h.prevVal||0),0);
  const TDPP=TPREV>0?(TDP/TPREV)*100:0;
  const TAD=enriched.reduce((s,h)=>s+h.annDiv,0);
  const TR=realized.reduce((s,t)=>s+t.pnl,0);
  const TRY=realized.filter(t=>t.date?.startsWith(new Date().getFullYear().toString())).reduce((s,t)=>s+t.pnl,0);

  const byAcct=ACCOUNTS.map(a=>({
    a,color:ACCT_COLOR[a]||"#475569",
    value:enriched.filter(h=>h.account===a).reduce((s,h)=>s+(h.value||0),0),
    cost:enriched.filter(h=>h.account===a).reduce((s,h)=>s+h.cost,0),
    pnl:enriched.filter(h=>h.account===a).reduce((s,h)=>s+(h.pnl||0),0),
    dPnl:enriched.filter(h=>h.account===a).reduce((s,h)=>s+(h.dPnl||0),0),
    cnt:enriched.filter(h=>h.account===a).length,
  })).filter(x=>x.value>0);

  const byGrp=Object.entries(ACCOUNT_GROUPS).map(([g,accts])=>({
    g,value:enriched.filter(h=>accts.includes(h.account)).reduce((s,h)=>s+(h.value||0),0),
    cost:enriched.filter(h=>accts.includes(h.account)).reduce((s,h)=>s+h.cost,0),
    pnl:enriched.filter(h=>accts.includes(h.account)).reduce((s,h)=>s+(h.pnl||0),0),
    cnt:enriched.filter(h=>accts.includes(h.account)).length,
  })).filter(x=>x.value>0);

  const exportData=()=>{const b=new Blob([JSON.stringify({holdings,realized,exportedAt:new Date().toISOString()},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`palazzo_${today()}.json`;a.click();};
  const importData=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const p=JSON.parse(ev.target.result);if(p.holdings){setHoldings(p.holdings);if(p.realized)setRealized(p.realized);alert(`✅ ${p.holdings.length}개 종목 복원`);}};catch{alert("❌ 오류");}};r.readAsText(f);e.target.value="";};

  return(
    <div style={{background:"#0a0f1e",minHeight:"100dvh",paddingBottom:80}}>
      {tab==="home"&&<HomeTab enriched={enriched} TV={TV} TC={TC} TP={TP} TPP={TPP} TDP={TDP} TDPP={TDPP} TAD={TAD} TR={TR} TRY={TRY} usdKrw={usdKrw} loading={loading} lastUpd={lastUpd} onRefresh={fetchPrices} byAcct={byAcct} byGrp={byGrp} cloudStatus={cloudStatus} onSelect={setSelH} realized={realized} setRealized={setRealized} showAddRealized={showAddRealized} setShowAddRealized={setShowAddRealized} exportData={exportData} importData={importData} chartData={chartData}/>}
      {tab==="dividend"&&<DivTab enriched={enriched} TV={TV} TAD={TAD} usdKrw={usdKrw}/>}
      {tab==="alloc"&&<AllocTab enriched={enriched} TV={TV} byAcct={byAcct} byGrp={byGrp}/>}
      {tab==="manage"&&<ManageTab enriched={enriched} holdings={holdings} setHoldings={setHoldings} usdKrw={usdKrw} TV={TV}/>}
      {selH&&<DetailModal h={selH} onClose={()=>setSelH(null)} usdKrw={usdKrw}/>}
      <nav className="tab-bar">
        {[["home","🏠","홈"],["dividend","💰","배당"],["alloc","🥧","비중"],["manage","📋","종목"]].map(([k,ic,lb])=>(
          <button key={k} className={`tab-btn${tab===k?" active":""}`} onClick={()=>setTab(k)}>
            <span className="tab-icon">{ic}</span>{lb}
          </button>
        ))}
      </nav>
    </div>
  );
}

// ── 자산 추이 차트 ──
function AssetChart({chartData,usdKrw}){
  const [range,setRange]=useState("3M"); // 1M, 3M, 6M, 1Y, ALL
  const now=new Date();
  const filtered=useMemo(()=>{
    if(!chartData.length) return [];
    const days=range==="1M"?30:range==="3M"?90:range==="6M"?180:range==="1Y"?365:9999;
    const cutoff=new Date(now);cutoff.setDate(cutoff.getDate()-days);
    const cutStr=cutoff.toISOString().slice(0,10);
    return chartData.filter(d=>d.date>=cutStr).sort((a,b)=>a.date.localeCompare(b.date));
  },[chartData,range]);

  if(chartData.length===0) return(
    <div className="card" style={{marginBottom:12}}>
      <div className="section-title">자산 추이</div>
      <div style={{textAlign:"center",color:"#334155",fontSize:12,padding:"20px 0"}}>
        📈 새로고침을 누를 때마다 오늘 자산이 기록돼요<br/>
        <span style={{fontSize:11,color:"#1e293b",marginTop:4,display:"block"}}>매일 앱 열어두면 자동으로 추이가 쌓여요</span>
      </div>
    </div>
  );

  const vals=filtered.map(d=>d.value);
  const costs=filtered.map(d=>d.cost);
  const minV=Math.min(...vals,...costs)*0.95;
  const maxV=Math.max(...vals,...costs)*1.02;
  const range2=maxV-minV||1;
  const W=320,H=120,PL=10,PR=10,PT=10,PB=20;
  const IW=W-PL-PR,IH=H-PT-PB;
  const toX=(i)=>PL+i/(filtered.length-1||1)*IW;
  const toY=(v)=>PT+IH-(v-minV)/range2*IH;

  const valPath=filtered.map((d,i)=>`${i===0?"M":"L"}${toX(i)},${toY(d.value)}`).join(" ");
  const costPath=filtered.map((d,i)=>`${i===0?"M":"L"}${toX(i)},${toY(d.cost)}`).join(" ");
  const areaPath=`${valPath} L${toX(filtered.length-1)},${PT+IH} L${PL},${PT+IH} Z`;

  const first=filtered[0];const last=filtered[filtered.length-1];
  const gain=last&&first?(last.value-first.value):0;
  const gainPct=first&&first.value>0?(gain/first.value)*100:0;

  return(
    <div className="card" style={{marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <div>
          <div className="section-title" style={{marginBottom:2}}>자산 추이</div>
          {filtered.length>1&&(
            <div style={{fontSize:12,color:gain>=0?"#22c55e":"#ef4444",fontWeight:700}}>
              {gain>=0?"+":""}{fUSD(gain)} ({gainPct>=0?"+":""}{gainPct.toFixed(1)}%)
              <span style={{fontSize:10,color:"#64748b",marginLeft:6}}>{range} 기간</span>
            </div>
          )}
        </div>
        <div style={{display:"flex",gap:4}}>
          {["1M","3M","6M","1Y","ALL"].map(r=>(
            <button key={r} onClick={()=>setRange(r)}
              style={{padding:"3px 7px",borderRadius:5,border:`1px solid ${range===r?"#3b82f6":"#1e293b"}`,background:range===r?"#3b82f6":"transparent",color:range===r?"#fff":"#64748b",fontSize:10,fontWeight:600,cursor:"pointer"}}>
              {r}
            </button>
          ))}
        </div>
      </div>

      {filtered.length<2?(
        <div style={{textAlign:"center",color:"#334155",fontSize:12,padding:"16px 0"}}>데이터 축적 중... ({filtered.length}일)</div>
      ):(
        <>
          <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{overflow:"visible"}}>
            {/* 그리드 라인 */}
            {[0.25,0.5,0.75].map(p=>(
              <line key={p} x1={PL} y1={PT+IH*p} x2={W-PR} y2={PT+IH*p} stroke="#1e293b" strokeWidth="0.5"/>
            ))}
            {/* 원금 라인 */}
            <path d={costPath} fill="none" stroke="#64748b" strokeWidth="1" strokeDasharray="3,3"/>
            {/* 자산 영역 */}
            <path d={areaPath} fill={gain>=0?"#22c55e":"#ef4444"} opacity="0.08"/>
            {/* 자산 라인 */}
            <path d={valPath} fill="none" stroke={gain>=0?"#22c55e":"#ef4444"} strokeWidth="2"/>
            {/* 현재 점 */}
            <circle cx={toX(filtered.length-1)} cy={toY(last.value)} r="4" fill={gain>=0?"#22c55e":"#ef4444"}/>
            {/* Y축 레이블 */}
            <text x={W-PR+2} y={toY(maxV)+4} fill="#64748b" fontSize="8">{fUSD(maxV)}</text>

// ── 배당 탭 ──
function DivTab({enriched,TV,TAD,usdKrw}){
  const [selM,setSelM]=useState(new Date().getMonth());
  const mDiv=useMemo(()=>{
    const b=Array(12).fill(0);
    enriched.forEach(h=>{if(!h.annDiv)return;const kd=KDIV[h.ticker];if(kd?.m?.length>0)kd.m.forEach(m=>b[m-1]+=h.annDiv/kd.m.length);else for(let i=0;i<12;i++)b[i]+=h.annDiv/12;});
    return b;
  },[enriched]);
  const maxD=Math.max(...mDiv,1);
  const mH=enriched.filter(h=>{if(!h.annDiv)return false;const kd=KDIV[h.ticker];return kd?.m?.includes(selM+1)||(!kd&&h.annDiv>0);});
  return(
    <div style={{padding:"0 14px 14px"}}>
      <div className="safe-top" style={{marginBottom:14}}>
        <div style={{fontSize:10,color:"#64748b",fontWeight:700,letterSpacing:1}}>DIVIDEND</div>
        <div style={{fontSize:18,fontWeight:800}}>배당 수익</div>
      </div>
      <div style={{background:"linear-gradient(135deg,#1a1a0a,#131c2e)",borderRadius:14,padding:16,marginBottom:12,border:"1px solid #2a2a0f"}}>
        <div style={{fontSize:10,color:"#f59e0b",fontWeight:700,marginBottom:6}}>연간 배당 예상</div>
        <div style={{fontSize:28,fontWeight:900,color:"#f59e0b"}}>{fUSD(TAD)}</div>
        <div style={{fontSize:12,color:"#64748b",marginTop:2}}>≈ ₩{(TAD*usdKrw/1e4).toFixed(0)}만 · 월 {fUSD(TAD/12)}</div>
        <div style={{marginTop:10,fontSize:11,color:"#64748b"}}>
          배당수익률: {TAD>0&&TV>0?((TAD/TV)*100).toFixed(2):0}%
        </div>
      </div>
      <div className="card">
        <div className="section-title">월별 배당 스케줄</div>
        <div style={{display:"flex",gap:3,alignItems:"flex-end",height:70,marginBottom:8}}>
          {mDiv.map((v,i)=>(
            <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,cursor:"pointer"}} onClick={()=>setSelM(i)}>
              <div style={{width:"100%",background:selM===i?"#f59e0b":v>0?"#854d0e":"#1e293b",borderRadius:"3px 3px 0 0",height:`${Math.max((v/maxD)*56,2)}px`}}/>
              <div style={{fontSize:8,color:selM===i?"#f59e0b":"#64748b",fontWeight:selM===i?700:400}}>{i+1}월</div>
            </div>
          ))}
        </div>
        <div style={{textAlign:"center",padding:"8px",background:"#0a0f1e",borderRadius:8}}>
          <span style={{fontSize:12,color:"#94a3b8"}}>{selM+1}월 예상: </span>
          <span style={{fontSize:14,fontWeight:700,color:"#f59e0b"}}>{fUSD(mDiv[selM])}</span>
        </div>
      </div>
      <div className="card">
        <div className="section-title">{selM+1}월 배당 종목</div>
        {mH.length===0?<div style={{color:"#334155",fontSize:12,textAlign:"center",padding:"14px 0"}}>이 달은 배당 없음</div>:
        mH.map(h=>{const kd=KDIV[h.ticker];const ps=kd?kd.a/(kd.m?.length||4):0;return(
          <div key={h.id} className="hrow">
            <div>
              <div style={{fontWeight:700,fontSize:13}}>{h.ticker}</div>
              <div style={{fontSize:11,color:"#64748b"}}>주당 ${ps.toFixed(3)} × {h.qty.toLocaleString(undefined,{maximumFractionDigits:2})}주</div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontWeight:700,color:"#f59e0b"}}>{fUSD(ps*h.qty)}</div>
              <div style={{fontSize:11,color:"#64748b"}}>연 {fUSD(h.annDiv)}</div>
            </div>
          </div>
        );})}
      </div>
      <div className="card">
        <div className="section-title">배당 TOP 종목</div>
        {[...enriched].filter(h=>h.annDiv>0).sort((a,b)=>b.annDiv-a.annDiv).slice(0,8).map(h=>(
          <div key={h.id} className="hrow">
            <div><div style={{fontWeight:700,fontSize:13}}>{h.ticker} <span style={{fontSize:11,color:"#64748b"}}>{h.name}</span></div>
              <div style={{fontSize:11,color:"#64748b"}}>수익률 {h.divYield.toFixed(2)}%</div>

            <div style={{textAlign:"right"}}>

            ["현재가",h.isKRW?(h.raw?fKRW(h.raw):"—"):(h.pUSD?`$${h.pUSD.toFixed(2)}`:"—"),"#f1f5f9"],
            ["매입원가",fUSD(h.cost),"#94a3b8"],
          ].map(([l,v,c])=>(
            <div key={l} style={{background:"#0a0f1e",borderRadius:10,padding:"10px 12px"}}>
              <div style={{fontSize:10,color:"#64748b",marginBottom:2}}>{l}</div>
              <div style={{fontSize:14,fontWeight:700,color:c}}>{v}</div>
            </div>
          ))}
        </div>
        {kd&&kd.a>0&&(
          <div style={{background:"#1a1a0a",border:"1px solid #2a2a0f",borderRadius:12,padding:"12px 14px"}}>
            <div style={{fontSize:11,color:"#f59e0b",fontWeight:700,marginBottom:8}}>💰 배당 정보</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
              {[["주당 연배당",`$${kd.a.toFixed(3)}`],["연 ${kd.f}회",`월 ${kd.m?.join(",")||"—"}월`],["내 연배당",fUSD(h.annDiv)]].map(([l,v])=>(
                <div key={l}><div style={{fontSize:9,color:"#64748b",marginBottom:2}}>{l}</div><div style={{fontSize:13,fontWeight:700,color:"#f59e0b"}}>{v}</div></div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── 도넛 차트 ──
function DonutChart({data,total}){
  if(!total||!data.length)return null;
  let cum=0;
  const slices=data.map(d=>{const p=d.value/total;const s=cum;cum+=p;return{...d,p,s};});
  const r=75,cx=100,cy=100,sw=24;
  const arc=(s,e)=>{const a1=s*2*Math.PI-Math.PI/2,a2=e*2*Math.PI-Math.PI/2;const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);return`M ${x1} ${y1} A ${r} ${r} 0 ${(e-s)>.5?1:0} 1 ${x2} ${y2}`;};
  return(
    <div style={{display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
      <svg width={200} height={200}>
        {slices.map((s,i)=><path key={i} d={arc(s.s,s.s+s.p)} fill="none" stroke={s.color||"#888"} strokeWidth={sw} strokeLinecap="butt"/>)}
        <text x={cx} y={cy-6} textAnchor="middle" fill="#64748b" fontSize={10}>총자산</text>
        <text x={cx} y={cx+8} textAnchor="middle" fill="#f1f5f9" fontSize={12} fontWeight={700}>{fUSD(total)}</text>
      </svg>
      <div style={{display:"flex",flexDirection:"column",gap:5,flex:1}}>
        {[...slices].sort((a,b)=>b.p-a.p).map((s,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:7,fontSize:12}}>
            <div style={{width:9,height:9,borderRadius:2,background:s.color||"#888",flexShrink:0}}/>
            <span style={{color:"#94a3b8",flex:1,fontSize:11,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{s.label}</span>
            <span style={{color:"#f1f5f9",fontWeight:700,flexShrink:0}}>{(s.p*100).toFixed(1)}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
