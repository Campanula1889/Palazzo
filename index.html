<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="PALAZZO"/>
<meta name="theme-color" content="#0a0f1e"/>
<title>PALAZZO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0a0f1e;color:#f1f5f9;font-family:-apple-system,'Noto Sans KR',sans-serif;overscroll-behavior:none;-webkit-font-smoothing:antialiased;font-size:14px}
::-webkit-scrollbar{display:none}
.safe{padding-top:max(14px,env(safe-area-inset-top))}
#app{padding-bottom:max(80px,calc(60px + env(safe-area-inset-bottom)))}
/* 탭바 */
#tabbar{position:fixed;bottom:0;left:0;right:0;background:#0f172a;border-top:1px solid #1e293b;display:flex;padding-bottom:max(8px,env(safe-area-inset-bottom));z-index:100}
.tbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 6px;border:none;background:transparent;cursor:pointer;color:#64748b;font-size:10px;font-weight:600;font-family:inherit}
.tbtn.on{color:#3b82f6}
.tbtn span:first-child{font-size:20px;line-height:1}
/* 카드 */
.card{background:#131c2e;border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid #1e293b}
.stitle{font-size:11px;color:#64748b;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
/* 행 */
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #0a0f1e}
.row:last-child{border-bottom:none}
/* 버튼 */
.bp{background:#3b82f6;color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;width:100%;font-family:inherit}
.bs{background:#1e293b;color:#94a3b8;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.bd{background:#ef4444;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
/* 인풋 */
.inp{width:100%;background:#0a0f1e;border:1px solid #1e293b;border-radius:10px;padding:11px 14px;color:#f1f5f9;font-size:14px;font-family:inherit;margin-bottom:12px}
.lbl{display:block;font-size:11px;color:#94a3b8;font-weight:600;margin-bottom:5px}
/* 칩 */
.chip{display:inline-flex;align-items:center;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid #1e293b;background:transparent;color:#94a3b8;white-space:nowrap;font-family:inherit}
.chip.on{background:#3b82f6;border-color:#3b82f6;color:#fff}
/* 모달 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:flex-end}
.mbox{background:#131c2e;border-radius:20px 20px 0 0;padding:20px 16px 44px;width:100%;max-height:90vh;overflow-y:auto}
/* 스크롤X */
.sx{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-ms-overflow-style:none;scrollbar-width:none}
/* 스피너 */
.spin{display:inline-block;width:12px;height:12px;border:2px solid #334155;border-top-color:#3b82f6;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.green{color:#22c55e}.red{color:#ef4444}.muted{color:#64748b}.sub{color:#94a3b8}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="tabbar">
  <button class="tbtn on" onclick="showTab('home')" id="t-home"><span>🏠</span>홈</button>
  <button class="tbtn" onclick="showTab('dividend')" id="t-dividend"><span>💰</span>배당</button>
  <button class="tbtn" onclick="showTab('alloc')" id="t-alloc"><span>🥧</span>비중</button>
  <button class="tbtn" onclick="showTab('manage')" id="t-manage"><span>📋</span>종목</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
// ── Firebase ──
firebase.initializeApp({
  apiKey:"AIzaSyDUnXG-Zi-84903-3m4vY6QDnhjXm3QSzI",
  authDomain:"palazzo-portfolio.firebaseapp.com",
  projectId:"palazzo-portfolio",
  storageBucket:"palazzo-portfolio.firebasestorage.app",
  messagingSenderId:"684537510698",
  appId:"1:684537510698:web:e0a29d652baf84f82fbc53"
});
const db = firebase.firestore();

// ── 상수 ──
const SK="palazzo_v5", DK="palazzo_daily_v5", RK="palazzo_realized_v5", CK="palazzo_chart_v5";

const ACCOUNT_GROUPS = {
  "HUI":["Hui Individual (Fidelity)","Hui Individual 2 (Fidelity)","Hui Individual 3 (Fidelity)","Hui 401K","Hui Trad IRA","Hui Roth IRA","Hui SoFi","Hui Acorn","Coinbase Hui"],
  "SANG":["Sang 401K","Sang Roth IRA","Sang Individual (Fidelity)","Sang Trad IRA","Kang Individual 2024 (Fidelity)","ETrade","Robinhood Sang","Sang SoFi","Coinbase Sang"],
  "FAMILY":["Michelle","ESA Schwab","Yon Schwab","Chang Schwab"],
  "OTHER":["LS Securities","Binance","Other"]
};
const ACCOUNTS = Object.values(ACCOUNT_GROUPS).flat();
const ACOL = {
  "Hui Individual (Fidelity)":"#6366f1","Hui Individual 2 (Fidelity)":"#818cf8","Hui Individual 3 (Fidelity)":"#a5b4fc",
  "Hui 401K":"#4f46e5","Hui Roth IRA":"#7c3aed","Hui Trad IRA":"#9333ea","Hui SoFi":"#f97316","Hui Acorn":"#84cc16","Coinbase Hui":"#f59e0b",
  "Sang 401K":"#10b981","Sang Roth IRA":"#059669","Sang Individual (Fidelity)":"#0d9488","Sang Trad IRA":"#0891b2",
  "Kang Individual 2024 (Fidelity)":"#0284c7","ETrade":"#2563eb","Robinhood Sang":"#16a34a","Sang SoFi":"#ea580c","Coinbase Sang":"#d97706",
  "Michelle":"#ec4899","ESA Schwab":"#db2777","Yon Schwab":"#8b5cf6","Chang Schwab":"#64748b",
  "LS Securities":"#ef4444","Binance":"#f59e0b","Other":"#475569"
};
const TCOL = {"미국주식":"#3b82f6","레버리지ETF":"#f59e0b","크립토":"#8b5cf6","한국주식":"#10b981","채권/기타":"#6b7280"};
const TYPES = ["미국주식","레버리지ETF","크립토","한국주식","채권/기타"];
const KDIV = {
  AAPL:{a:1.00,f:4,m:[2,5,8,11]},MSFT:{a:3.00,f:4,m:[3,6,9,12]},GOOGL:{a:0.80,f:4,m:[3,6,9,12]},
  META:{a:2.00,f:4,m:[3,6,9,12]},NVDA:{a:0.04,f:4,m:[3,6,9,12]},AVGO:{a:21.00,f:4,m:[3,6,9,12]},
  INTC:{a:0.50,f:4,m:[3,6,9,12]},MU:{a:0.46,f:4,m:[2,5,8,11]},LRCX:{a:8.80,f:4,m:[1,4,7,10]},
  SMH:{a:1.20,f:4,m:[3,6,9,12]},EWY:{a:1.80,f:2,m:[6,12]},TQQQ:{a:0.40,f:4,m:[3,6,9,12]},
  SOXL:{a:0.60,f:4,m:[3,6,9,12]},DRAM:{a:0.30,f:4,m:[3,6,9,12]},MUU:{a:1.20,f:4,m:[3,6,9,12]},
  NASA:{a:0.20,f:4,m:[3,6,9,12]},LRCU:{a:0.40,f:4,m:[3,6,9,12]},
};

// ── 상태 ──
// localStorage에 저장된 데이터가 있으면 사용, 없을 때만 기본값
const savedHoldings = lsGet(SK, null);
const savedRealized = lsGet(RK, null);

let state = {
  holdings: savedHoldings || getDefaultHoldings(),
  realized: savedRealized || [],
  chartData: lsGet(CK, []),
  prices: {},
  prevSnap: lsGet(DK, {}),
  usdKrw: 1515,
  loading: false,
  lastUpd: null,
  cloudStatus: "",
  currentTab: "home",
  filterType: "전체",
  sortBy: "value",
  viewMode: "평가",
  chartRange: "3M",
  selectedMonth: new Date().getMonth(),
  allocView: "type",
  manageFilter: "전체",
};

// ── 유틸 ──
function lsGet(k,d){try{const s=localStorage.getItem(k);return s?JSON.parse(s):d;}catch{return d;}}
function lsSave(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
function today(){return new Date().toISOString().slice(0,10);}
function fUSD(n){if(n==null)return"—";return"$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function fKRW(n){if(n==null)return"—";return"₩"+Math.round(n).toLocaleString();}
function fPct(n){if(n==null)return"—";return(n>=0?"+":"")+n.toFixed(2)+"%";}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

// ── Firebase ──
async function cloudSave(){
  try{
    await db.collection("palazzo").doc("data").set({
      holdings:JSON.stringify(state.holdings),
      realized:JSON.stringify(state.realized),
      updatedAt:new Date().toISOString()
    });
    return true;
  }catch(e){console.error(e);return false;}
}
async function cloudLoad(){
  try{
    const d=await db.collection("palazzo").doc("data").get();
    if(d.exists){
      const r=d.data();
      return{holdings:JSON.parse(r.holdings||"[]"),realized:JSON.parse(r.realized||"[]")};
    }
  }catch(e){console.error(e);}
  return null;
}
async function cloudSaveChart(){
  try{await db.collection("palazzo").doc("chart").set({data:JSON.stringify(state.chartData),updatedAt:new Date().toISOString()});}catch{}
}
async function cloudLoadChart(){
  try{const d=await db.collection("palazzo").doc("chart").get();if(d.exists){const cd=JSON.parse(d.data().data||"[]");if(cd.length>0){state.chartData=cd;lsSave(CK,cd);}}}catch{}
}

// ── 데이터 저장 ──
function saveAll(){
  lsSave(SK,state.holdings);
  lsSave(RK,state.realized);
  setStatus("저장중...");
  cloudSave().then(ok=>{setStatus(ok?"☁️ 저장됨":"💾 로컬저장");setTimeout(()=>setStatus(""),3000);});
}
function setStatus(s){state.cloudStatus=s;const el=document.getElementById("cloud-status");if(el)el.textContent=s;}

// ── enriched 계산 ──
function getEnriched(){
  return state.holdings.map(h=>{
    const raw=h.manualPrice||(state.prices[h.ticker])||null;
    const isKRW=h.type==="한국주식";
    const pUSD=isKRW?(raw?raw/state.usdKrw:null):raw;
    const aUSD=isKRW?h.avgCost/state.usdKrw:h.avgCost;
    const value=pUSD!=null?pUSD*h.qty:null;
    const cost=aUSD*h.qty;
    const pnl=value!=null?value-cost:null;
    const pnlPct=(pnl!=null&&cost>0)?(pnl/cost)*100:null;
    const prevRaw=state.prevSnap?.prices?.[h.ticker]||state.prices[h.ticker+"_prev"]||null;
    const prevUSD=isKRW?(prevRaw?prevRaw/state.usdKrw:null):prevRaw;
    const prevVal=prevUSD!=null?prevUSD*h.qty:null;
    const dPnl=(value!=null&&prevVal!=null)?value-prevVal:null;
    const dPct=(dPnl!=null&&prevVal>0)?(dPnl/prevVal)*100:null;
    const kd=KDIV[h.ticker];
    const annDiv=kd?kd.a*h.qty:0;
    const divYield=pUSD>0&&kd?(kd.a/pUSD)*100:0;
    return{...h,raw,pUSD,aUSD,value,cost,pnl,pnlPct,dPnl,dPct,prevVal,isKRW,annDiv,divYield};
  });
}

function getTotals(enriched){
  const TV=enriched.reduce((s,h)=>s+(h.value||0),0);
  const TC=enriched.reduce((s,h)=>s+h.cost,0);
  const TP=TV-TC;
  const TPP=TC>0?(TP/TC)*100:0;
  const TDP=enriched.reduce((s,h)=>s+(h.dPnl||0),0);
  const TPREV=enriched.reduce((s,h)=>s+(h.prevVal||0),0);
  const TDPP=TPREV>0?(TDP/TPREV)*100:0;
  const TAD=enriched.reduce((s,h)=>s+h.annDiv,0);
  const TR=state.realized.reduce((s,t)=>s+t.pnl,0);
  const TRY=state.realized.filter(t=>t.date?.startsWith(new Date().getFullYear().toString())).reduce((s,t)=>s+t.pnl,0);
  return{TV,TC,TP,TPP,TDP,TDPP,TAD,TR,TRY};
}

// ── 시세 조회 ──
async function fetchPrices(){
  if(state.loading)return;
  state.loading=true;render();
  try{
    // 환율
    try{
      const r=await fetch("https://query1.finance.yahoo.com/v8/finance/chart/KRW=X?interval=1d&range=1d",{mode:"cors"});
      const d=await r.json();
      const fx=d?.chart?.result?.[0]?.meta?.regularMarketPrice;
      if(fx>900&&fx<2500)state.usdKrw=fx;
    }catch{}

    const autoH=state.holdings.filter(h=>h.type!=="한국주식"&&!h.manualPrice);
    if(autoH.length>0){
      for(let i=0;i<autoH.length;i+=10){
        const chunk=autoH.slice(i,i+10);
        const syms=chunk.map(h=>h.ticker).join(",");
        try{
          const r=await fetch(`https://query1.finance.yahoo.com/v7/finance/quote?symbols=${syms}`,{mode:"cors"});
          const d=await r.json();
          (d?.quoteResponse?.result||[]).forEach(q=>{
            if(q.regularMarketPrice>0){
              state.prices[q.symbol]=q.regularMarketPrice;
              if(q.regularMarketPreviousClose>0)state.prices[q.symbol+"_prev"]=q.regularMarketPreviousClose;
            }
          });
        }catch{
          for(const h of chunk){
            try{
              const r=await fetch(`https://query2.finance.yahoo.com/v8/finance/chart/${h.ticker}?interval=1d&range=2d`,{mode:"cors"});
              const d=await r.json();
              const m=d?.chart?.result?.[0]?.meta;
              if(m?.regularMarketPrice>0){
                state.prices[h.ticker]=m.regularMarketPrice;
                if(m.chartPreviousClose>0)state.prices[h.ticker+"_prev"]=m.chartPreviousClose;
              }
            }catch{}
          }
        }
      }
    }

    // 전일 스냅샷 저장
    const snap=lsGet(DK,{});
    if(!snap.date||snap.date!==today()){
      const ns={date:today(),prices:{}};
      state.holdings.forEach(h=>{const p=state.prices[h.ticker+"_prev"]||state.prices[h.ticker]||h.manualPrice;if(p)ns.prices[h.ticker]=p;});
      lsSave(DK,ns);state.prevSnap=ns;
    }

    state.lastUpd=new Date();

    // 자산 추이 저장
    const enriched=getEnriched();
    const TV=enriched.reduce((s,h)=>s+(h.value||0),0);
    const TC=enriched.reduce((s,h)=>s+h.cost,0);
    if(TV>0&&!state.chartData.find(d=>d.date===today())){
      state.chartData=[...state.chartData,{date:today(),value:TV,cost:TC}].slice(-365);
      lsSave(CK,state.chartData);
      cloudSaveChart();
    }
  }catch(e){console.error(e);}
  state.loading=false;
  render();
  // 5분 후 자동 갱신
  setTimeout(fetchPrices,5*60*1000);
}

// ── 렌더링 ──
function render(){
  const enriched=getEnriched();
  const totals=getTotals(enriched);
  const tab=state.currentTab;
  let html="";
  if(tab==="home") html=renderHome(enriched,totals);
  else if(tab==="dividend") html=renderDividend(enriched,totals);
  else if(tab==="alloc") html=renderAlloc(enriched,totals);
  else if(tab==="manage") html=renderManage(enriched);
  document.getElementById("app").innerHTML=`<div style="padding:0 14px 14px">${html}</div>`;

  // 탭 버튼 활성화
  document.querySelectorAll(".tbtn").forEach(b=>b.classList.remove("on"));
  const tb=document.getElementById("t-"+tab);
  if(tb)tb.classList.add("on");
}

function showTab(t){state.currentTab=t;render();window.scrollTo(0,0);}

// ── 홈 탭 ──
function renderHome(enriched,{TV,TC,TP,TPP,TDP,TDPP,TAD,TR,TRY}){
  // 정렬
  const sorted=[...enriched].sort((a,b)=>{
    if(state.sortBy==="daily")return(b.dPnl||0)-(a.dPnl||0);
    if(state.sortBy==="total")return(b.pnl||0)-(a.pnl||0);
    return(b.value||0)-(a.value||0);
  });

  // 계좌 그룹
  const grpRows=Object.entries(ACCOUNT_GROUPS).map(([g,accts])=>{
    const v=enriched.filter(h=>accts.includes(h.account)).reduce((s,h)=>s+(h.value||0),0);
    const p=enriched.filter(h=>accts.includes(h.account)).reduce((s,h)=>s+(h.pnl||0),0);
    const c=enriched.filter(h=>accts.includes(h.account)).reduce((s,h)=>s+h.cost,0);
    const cnt=enriched.filter(h=>accts.includes(h.account)).length;
    const pp=c>0?(p/c)*100:0;
    const pct=TV>0?(v/TV)*100:0;
    if(v<=0)return"";
    return`<div style="background:#0a0f1e;border-radius:10px;padding:10px 12px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-weight:700;font-size:13px">${esc(g)}</div><div style="font-size:10px;color:#64748b">${pct.toFixed(1)}% · ${cnt}종목</div></div>
        <div style="text-align:right"><div style="font-weight:700">${fUSD(v)}</div><div style="font-size:11px;color:${p>=0?"#22c55e":"#ef4444"}">${p>=0?"+":""}${fUSD(p)} (${pp>=0?"+":""}${pp.toFixed(1)}%)</div></div>
      </div>
    </div>`;
  }).join("");

  // 계좌별
  const acctRows=ACCOUNTS.map(a=>{
    const v=enriched.filter(h=>h.account===a).reduce((s,h)=>s+(h.value||0),0);
    const p=enriched.filter(h=>h.account===a).reduce((s,h)=>s+(h.pnl||0),0);
    const c=enriched.filter(h=>h.account===a).reduce((s,h)=>s+h.cost,0);
    const dp=enriched.filter(h=>h.account===a).reduce((s,h)=>s+(h.dPnl||0),0);
    const cnt=enriched.filter(h=>h.account===a).length;
    if(v<=0)return"";
    const pct=TV>0?(v/TV)*100:0;
    const pp=c>0?(p/c)*100:0;
    const col=ACOL[a]||"#475569";
    return`<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:3px">
        <div style="display:flex;align-items:center;gap:6px">
          <div style="width:8px;height:8px;border-radius:2px;background:${col};flex-shrink:0"></div>
          <div><div style="font-size:12px;font-weight:700">${esc(a)}</div><div style="font-size:10px;color:#64748b">${pct.toFixed(1)}% · ${cnt}종목</div></div>
        </div>
        <div style="text-align:right">
          <div style="font-size:13px;font-weight:700">${fUSD(v)}</div>
          <div style="font-size:11px;color:${p>=0?"#22c55e":"#ef4444"}">${p>=0?"+":""}${fUSD(p)} (${pp>=0?"+":""}${pp.toFixed(1)}%)</div>
          ${dp!==0?`<div style="font-size:10px;color:${dp>=0?"#22c55e":"#ef4444"}">일간 ${dp>=0?"+":""}${fUSD(dp)}</div>`:""}
        </div>
      </div>
      <div style="height:3px;background:#1e293b;border-radius:2px"><div style="height:100%;width:${pct}%;background:${col};border-radius:2px"></div></div>
    </div>`;
  }).join("");

  // 자산 추이 차트
  const chartHtml=renderChart();

  // 종목 리스트
  const holdRows=sorted.map(h=>{
    const col=TCOL[h.type]||"#334155";
    const right=state.viewMode==="시세"
      ?`<div style="font-weight:700;font-size:13px">${h.isKRW?(h.raw?fKRW(h.raw):"—"):(h.pUSD?"$"+h.pUSD.toFixed(2):"—")}</div><div style="font-size:12px;color:${(h.dPct||0)>=0?"#22c55e":"#ef4444"}">${h.dPct!=null?fPct(h.dPct):"—"}</div>`
      :`<div style="font-weight:700;font-size:13px">${h.value!=null?fUSD(h.value):"<span style='color:#334155'>—</span>"}</div><div style="font-size:12px;color:${(h.pnlPct||0)>=0?"#22c55e":"#ef4444"}">${h.pnlPct!=null?fPct(h.pnlPct):"—"}</div>`;
    return`<div class="row" onclick="showDetail(${h.id})" style="cursor:pointer">
      <div style="display:flex;align-items:center;gap:10px;flex:1">
        <div style="width:38px;height:38px;border-radius:10px;background:${col};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0">${esc(h.ticker.slice(0,3))}</div>
        <div><div style="font-weight:700;font-size:14px">${esc(h.ticker)}</div><div style="font-size:11px;color:#64748b">${h.qty.toLocaleString("en-US",{maximumFractionDigits:4})}주 · ${esc(h.account)}</div></div>
      </div>

// ── 자산 추이 차트 ──
function renderChart(){
  const data=state.chartData;
  if(data.length===0){
    return`<div class="card" style="margin-bottom:12px">
      <div class="stitle">자산 추이</div>
      <div style="text-align:center;color:#334155;font-size:12px;padding:20px 0">📈 새로고침을 누를 때마다 오늘 자산이 기록돼요<br><span style="font-size:11px;display:block;margin-top:4px">매일 열면 자동으로 추이가 쌓여요</span></div>
    </div>`;
  }

  const now=new Date();
  const ranges={"1M":30,"3M":90,"6M":180,"1Y":365,"ALL":9999};
  const days=ranges[state.chartRange]||90;
  const cutoff=new Date(now);cutoff.setDate(cutoff.getDate()-days);
  const cutStr=cutoff.toISOString().slice(0,10);
  const filtered=data.filter(d=>d.date>=cutStr).sort((a,b)=>a.date.localeCompare(b.date));

  if(filtered.length<2){
    return`<div class="card" style="margin-bottom:12px">
      <div class="stitle">자산 추이</div>
      <div style="text-align:center;color:#334155;font-size:12px;padding:16px 0">데이터 축적 중... (${filtered.length}일)<br><small style="color:#1e3a5f">매일 새로고침하면 차트가 쌓여요</small></div>
    </div>`;
  }

  const vals=filtered.map(d=>d.value);
  const costs=filtered.map(d=>d.cost);
  const minV=Math.min(...vals,...costs)*0.97;
  const maxV=Math.max(...vals,...costs)*1.02;
  const rng=maxV-minV||1;
  const W=300,H=100,PL=8,PR=60,PT=8,PB=18;
  const IW=W-PL-PR,IH=H-PT-PB;
  const toX=i=>PL+i/(filtered.length-1)*IW;
  const toY=v=>PT+IH-(v-minV)/rng*IH;
  const vPath=filtered.map((d,i)=>`${i===0?"M":"L"}${toX(i)},${toY(d.value)}`).join(" ");
  const cPath=filtered.map((d,i)=>`${i===0?"M":"L"}${toX(i)},${toY(d.cost)}`).join(" ");
  const aPath=vPath+` L${toX(filtered.length-1)},${PT+IH} L${PL},${PT+IH} Z`;
  const first=filtered[0],last=filtered[filtered.length-1];
  const gain=last.value-first.value;
  const gainPct=first.value>0?(gain/first.value)*100:0;
  const gc=gain>=0?"#22c55e":"#ef4444";
  const rangeButtons=["1M","3M","6M","1Y","ALL"].map(r=>`<button onclick="state.chartRange='${r}';render()" style="padding:3px 7px;border-radius:5px;border:1px solid ${state.chartRange===r?"#3b82f6":"#1e293b"};background:${state.chartRange===r?"#3b82f6":"transparent"};color:${state.chartRange===r?"#fff":"#64748b"};font-size:10px;font-weight:600;cursor:pointer;font-family:inherit">${r}</button>`).join("");

  return`<div class="card" style="margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div>
        <div class="stitle" style="margin-bottom:2px">자산 추이</div>
        <div style="font-size:12px;color:${gc};font-weight:700">${gain>=0?"+":""}${fUSD(gain)} (${gainPct>=0?"+":""}${gainPct.toFixed(1)}%) <span style="font-size:10px;color:#64748b">${state.chartRange}</span></div>
      </div>
      <div style="display:flex;gap:3px">${rangeButtons}</div>
    </div>
    <svg width="100%" viewBox="0 0 ${W} ${H}" style="overflow:visible">
      <line x1="${PL}" y1="${PT+IH*0.5}" x2="${W-PR}" y2="${PT+IH*0.5}" stroke="#1e293b" stroke-width="0.5"/>
      <path d="${cPath}" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
      <path d="${aPath}" fill="${gc}" opacity="0.08"/>
      <path d="${vPath}" fill="none" stroke="${gc}" stroke-width="2"/>
      <circle cx="${toX(filtered.length-1)}" cy="${toY(last.value)}" r="4" fill="${gc}"/>
      <text x="${W-PR+4}" y="${toY(maxV)+4}" fill="#64748b" font-size="8">${fUSD(maxV)}</text>
      <text x="${W-PR+4}" y="${toY(minV)+4}" fill="#64748b" font-size="8">${fUSD(minV)}</text>
    </svg>
    <div style="display:flex;justify-content:space-between;font-size:9px;color:#64748b;margin-top:4px">
      <span>${filtered[0]?.date?.slice(5)}</span><span>${filtered[filtered.length-1]?.date?.slice(5)}</span>
    </div>
    <div style="display:flex;gap:14px;margin-top:6px;justify-content:center;font-size:11px;color:#94a3b8">
      <span style="display:flex;align-items:center;gap:4px"><span style="width:12px;height:2px;background:${gc};display:inline-block"></span>자산</span>
      <span style="display:flex;align-items:center;gap:4px"><span style="width:12px;height:0;border-top:1px dashed #64748b;display:inline-block"></span>원금</span>
    </div>
  </div>`;
}

function renderDividend(enriched,{TV,TAD}){
  const mDiv=Array(12).fill(0);
  enriched.forEach(h=>{
    if(!h.annDiv)return;
    const kd=KDIV[h.ticker];
    if(kd?.m?.length>0)kd.m.forEach(m=>mDiv[m-1]+=h.annDiv/kd.m.length);
    else for(let i=0;i<12;i++)mDiv[i]+=h.annDiv/12;
  });
  const maxD=Math.max(...mDiv,1);
  const selM=state.selectedMonth;

  const barHtml=mDiv.map((v,i)=>`
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer" onclick="state.selectedMonth=${i};render()">
      <div style="width:100%;background:${selM===i?"#f59e0b":v>0?"#854d0e":"#1e293b"};border-radius:3px 3px 0 0;height:${Math.max((v/maxD)*56,2)}px;transition:height .3s"></div>
      <div style="font-size:8px;color:${selM===i?"#f59e0b":"#64748b"};font-weight:${selM===i?700:400}">${i+1}월</div>
    </div>`).join("");

  const mH=enriched.filter(h=>{

    return kd?.m?.includes(selM+1)||(!kd&&h.annDiv>0);

  const mRows=mH.map(h=>{

      <div><div style="font-weight:700;font-size:13px">${esc(h.ticker)} <span style="font-size:11px;color:#64748b">${esc(h.name)}</span></div>
      <div style="font-size:11px;color:#64748b">수익률 ${h.divYield.toFixed(2)}%</div></div>
      <div style="text-align:right"><div style="font-weight:700;color:#f59e0b">${fUSD(h.annDiv)}</div><div style="font-size:11px;color:#64748b">연간</div></div>
    </div>`).join("");

  return`
  <div class="safe" style="margin-bottom:14px">
    <div style="font-size:10px;color:#64748b;font-weight:700;letter-spacing:1px">DIVIDEND</div>
    <div style="font-size:18px;font-weight:800">배당 수익</div>
  </div>
  <div style="background:linear-gradient(135deg,#1a1a0a,#131c2e);border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid #2a2a0f">
    <div style="font-size:10px;color:#f59e0b;font-weight:700;margin-bottom:6px">연간 배당 예상</div>
    <div style="font-size:28px;font-weight:900;color:#f59e0b">${fUSD(TAD)}</div>

function renderDonut(data,total){
  if(!total||!data.length)return"<div style='color:#334155;text-align:center;padding:20px'>데이터 없음</div>";
  let cum=0;
  const slices=data.map(d=>{const p=d.value/total;const s=cum;cum+=p;return{...d,p,s};});
  const r=75,cx=100,cy=100,sw=24;
  function arc(s,e){
    const a1=s*2*Math.PI-Math.PI/2,a2=e*2*Math.PI-Math.PI/2;
    const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    return`M ${x1} ${y1} A ${r} ${r} 0 ${(e-s)>.5?1:0} 1 ${x2} ${y2}`;
  }
  const paths=slices.map(s=>`<path d="${arc(s.s,s.s+s.p)}" fill="none" stroke="${s.color||"#888"}" stroke-width="${sw}" stroke-linecap="butt"/>`).join("");
  const legend=[...slices].sort((a,b)=>b.p-a.p).map(s=>`
    <div style="display:flex;align-items:center;gap:7px;font-size:12px">
      <div style="width:9px;height:9px;border-radius:2px;background:${s.color||"#888"};flex-shrink:0"></div>
      <span style="color:#94a3b8;flex:1;font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${esc(s.label)}</span>
      <span style="color:#f1f5f9;font-weight:700;flex-shrink:0">${(s.p*100).toFixed(1)}%</span>
    </div>`).join("");
  return`<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
    <svg width="200" height="200">
      ${paths}
      <text x="${cx}" y="${cy-6}" text-anchor="middle" fill="#64748b" font-size="10">총자산</text>
      <text x="${cx}" y="${cy+9}" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="700">${fUSD(total)}</text>
    </svg>
    <div style="display:flex;flex-direction:column;gap:5px;flex:1">${legend}</div>
  </div>`;
}

  if(!v)return;
  const h=state.holdings.find(x=>x.id===id);

  h.manualPrice=v;
  saveAll();render();
}
function clearPrice(id){
  const h=state.holdings.find(x=>x.id===id);
  if(!h)return;
  h.manualPrice=null;

}
function confirmDelete(id){
  const el=document.getElementById("del-confirm-"+id);

function deleteHolding(id){
  state.holdings=state.holdings.filter(x=>x.id!==id);

}

      <div style="font-size:10px;color:#64748b;margin-bottom:4px">실현손익</div>
      <div id="r-pnl" style="font-size:22px;font-weight:800"></div>
    </div>
    <button onclick="saveRealized()" class="bp">저장</button>
  </div>`;
  document.body.appendChild(modal);
  ["r-qty","r-buy","r-sell"].forEach(id=>{
    document.getElementById(id).addEventListener("input",updateRealizedPreview);
  });
}
function updateRealizedPreview(){
  const qty=parseFloat(document.getElementById("r-qty")?.value)||0;
  const buy=parseFloat(document.getElementById("r-buy")?.value)||0;
  const sell=parseFloat(document.getElementById("r-sell")?.value)||0;
  if(qty&&buy&&sell){
    const pnl=(sell-buy)*qty;
    const pct=((sell-buy)/buy)*100;
    const el=document.getElementById("r-preview");
    const pnlEl=document.getElementById("r-pnl");
    if(el)el.style.display="block";
    if(pnlEl){pnlEl.style.color=pnl>=0?"#22c55e":"#ef4444";pnlEl.textContent=(pnl>=0?"+":"")+fUSD(pnl)+" ("+fPct(pct)+")";}
  }
}
function saveRealized(){
  const ticker=document.getElementById("r-ticker")?.value?.trim()?.toUpperCase();
  const qty=parseFloat(document.getElementById("r-qty")?.value);
  const buy=parseFloat(document.getElementById("r-buy")?.value);
  const sell=parseFloat(document.getElementById("r-sell")?.value);
  if(!ticker||!qty||!buy||!sell){alert("필수 항목을 입력해주세요");return;}
  const pnl=(sell-buy)*qty;
  const pnlPct=((sell-buy)/buy)*100;
  state.realized.push({
    ticker,account:document.getElementById("r-account")?.value||"Other",
    qty,buyPrice:buy,sellPrice:sell,pnl,pnlPct,
    date:document.getElementById("r-date")?.value||today(),
    memo:document.getElementById("r-memo")?.value||""
  });
  closeModal("realized-modal");
  saveAll();render();
}

function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{try{
    const p=JSON.parse(ev.target.result);
    if(p.holdings){state.holdings=p.holdings;if(p.realized)state.realized=p.realized;saveAll();render();alert("✅ "+p.holdings.length+"개 종목 복원");}
  }catch{alert("❌ 파일 오류");}};
  r.readAsText(f);e.target.value="";
}

// ── 초기화 ──
async function init(){
  render();
  // Firebase에서 데이터 로드
  try{
    const data=await cloudLoad();
    if(data&&data.holdings&&data.holdings.length>0){
      // Firebase 데이터가 localStorage보다 최신인지 확인
      const localCount=state.holdings.length;
      const cloudCount=data.holdings.length;
      // 클라우드 데이터 우선 적용 (더 많은 종목이거나 localStorage가 비어있을 때)
      if(cloudCount>=localCount){
        state.holdings=data.holdings;
        lsSave(SK,data.holdings);
        if(data.realized&&data.realized.length>0){
          state.realized=data.realized;
          lsSave(RK,data.realized);
        }
        setStatus("☁️ 동기화됨");
        setTimeout(()=>setStatus(""),3000);
        render();
      } else {
        setStatus("💾 로컬 데이터 사용");
        setTimeout(()=>setStatus(""),3000);
      }
    }
  }catch(e){console.error("Firebase load error:",e);}
  await cloudLoadChart();
  // 시세 조회 시작
  fetchPrices();
}

init();
</script>
